{id:"hmg",t:{ar:"الدرس 8: المحاور ومجموعة الحبيب",en:"Lesson 8: The interviewer and Al Habib"},
 goal:{ar:"تعرفين من يحاورك، وكيف تعمل المنظومة البحثية في الحبيب، وما الفرص التي تربطين بها خبرتك.",en:"Know your interviewer, how Al Habib’s research system works, and which opportunities to link your experience to."},
 b:[
 {k:"h",ar:"د. زياد ميمش",en:"Dr. Ziad Memish"},
 {k:"ul",ar:["أخصائي أمراض معدية، ورئيس تحرير مجلة الدكتور سليمان الحبيب الطبية، وأستاذ في كلية الطب بجامعة الفيصل.","مصنف ضمن الأكثر استشهاداً عالمياً من 2018 إلى 2024، وله أكثر من 900 ورقة محكّمة، ورئيس تحرير لعدة مجلات.","جائزة الإنجاز مدى الحياة من هيئة تنمية البحث والتطوير والابتكار (أكتوبر 2024)، ووسام الملك عبدالعزيز من الدرجة الأولى (2007)."],
  en:["Infectious disease specialist; Editor-in-Chief of the Dr. Sulaiman Al Habib Medical Journal; professor at Alfaisal University.","Highly Cited Researcher 2018–2024, 900+ peer-reviewed papers, editor of several journals.","RDIA Lifetime Achievement Award (October 2024); King Abdulaziz Medal, First Class (2007)."]},
 {k:"note",ar:"ماذا يعني هذا لك: سيقيّمك بعين باحث ورئيس تحرير. توقعي أسئلة عن النشر ودورك في منشوراتك والنزاهة البحثية. لا تحاولي منافسته علمياً؛ قدمي نفسك كالقادرة على بناء البنية التشغيلية التي تجعل البحث ممكناً.",en:"What this means: expect a researcher’s and editor’s lens, with questions on publishing, your role in your papers, and integrity. Don’t compete scientifically; present yourself as the one who builds the operational infrastructure that makes research possible."},
 {k:"h",ar:"المنظومة البحثية في الحبيب",en:"Al Habib’s research system"},
 {k:"ul",ar:["مركز الأبحاث يتبع الشؤون الأكاديمية، ولجنة الأخلاقيات جزء أساسي منه، وهي لجنة محلية تحت مظلة KACST.","المراجعة على مرحلتين: علمية في مركز الأبحاث ثم أخلاقية في اللجنة.","اللجنة نشطة وتطبق مسارات مختلفة (مثال: RC 25.08.75 مع إعفاء من الموافقة). في 2019 راجعت 63 مشروعاً بنسبة قبول 68%.","جوائز البحث عبر المجلة 1.5 مليون ريال: 500 ألف، 300 ألف، 200 ألف، 200 ألف لأربع مراجعات، 150 ألف للطلاب، وجائزة لممارسين في برامج SCFHS، برعاية وزير الصحة.","الأكاديمية: تعليم مستمر، ودبلومات وزمالات، والبورد السعودي، وزمالة جورج واشنطن في التعليم الطبي؛ ودرّبت 2,500 ممارس في سنة مع 18 جامعة.","كلية الدكتور سليمان الحبيب للمعرفة: بدأت بكالوريوس التمريض، والعام الدراسي بدأ 23 أغسطس 2026.","مستشفى جديد في الرياض بسعة 160 سريراً، متوقع تشغيله في الربع الثاني 2029."],
  en:["The Research Center sits under Academic Affairs; the IRB is a core part, as a local committee under KACST.","Two-step review: scientific at the Research Center, then ethical at the IRB.","The IRB is active and uses different pathways (e.g., RC 25.08.75 with consent waived). In 2019 it reviewed 63 projects with 68% acceptance.","Journal research awards SAR 1.5M: 500k, 300k, 200k, 200k for four reviews, 150k for students, plus SCFHS trainees, under the Minister of Health’s patronage.","Academy: CME, diplomas and fellowships, Saudi Board, a George Washington University fellowship; 2,500 practitioners trained in a year with 18 universities.","Dr. Sulaiman Al Habib College of Knowledge: nursing BSc launched; classes began 23 August 2026.","A new 160-bed Riyadh hospital expected to operate in Q2 2029."]},
 {k:"h",ar:"كيف تربطين خبرتك",en:"Linking your experience"},
 {k:"tbl",h:{ar:["ما لديهم","ما تقدمينه"],en:["What they have","What you offer"]},
  r:{ar:[["جوائز كبيرة تحفز الإنتاج البحثي","تدريب يضمن جودة هذا الإنتاج وامتثاله"],["كلية جديدة وطلبات بحثية ستزيد","ضبط دورة مراجعة اللجنة وتدريب الأخلاقيات"],["توسع في المستشفيات","مكتب مركزي للتجارب يخدم كل المواقع"],["أكاديمية بخبرة في التعليم المستمر","برنامج GCP و GLP معترف به"]],
     en:[["Large awards driving research output","Training that ensures its quality and compliance"],["A new college; rising research demand","A tighter IRB cycle and ethics training"],["Hospital expansion","A central trials office serving all sites"],["An experienced CME academy","A recognised GCP and GLP programme"]]}},
 {k:"warn",ar:"غير منشور: رقم تسجيل اللجنة لدى NCBE، وأي اعتماد دولي لها، ووجود وحدة تجارب مستقلة. لا تذكريها كحقائق. وأي ملاحظة على الإجراءات تُطرح كفرصة تطوير.",en:"Not published: the IRB’s NCBE number, any international accreditation, or a dedicated trials unit. Don’t state these as facts, and frame any process point as an opportunity."}
 ],
 self:[
  {q:{ar:"ما علاقة د. زياد بجوائز البحث في الحبيب؟",en:"How is Dr. Ziad linked to Al Habib’s research awards?"},a:{ar:"الجوائز تتبع مجلة الحبيب التي يرأس تحريرها.",en:"The awards belong to the journal he edits."}},
  {q:{ar:"كيف تتم المراجعة في الحبيب؟",en:"How does review work at Al Habib?"},a:{ar:"علمية في مركز الأبحاث أولاً، ثم أخلاقية في اللجنة.",en:"Scientific at the Research Center first, then ethical at the IRB."}},
  {q:{ar:"كيف تطرحين ملاحظة على بطء المراجعة؟",en:"How do you raise a point about slow review?"},a:{ar:"كفرصة تطوير: تشغيل المرحلتين بالتوازي للدراسات منخفضة الخطورة، وقياس زمن المراجعة كمؤشر.",en:"As an opportunity: parallel review for low-risk studies and turnaround as a KPI."}}
 ]},
{id:"trn",t:{ar:"الدرس 9: مقترح برنامج تدريب GCP و GLP",en:"Lesson 9: The GCP and GLP training proposal"},
 goal:{ar:"تشرحين لماذا الآن، وما التميز، وما الاعتمادات المطلوبة، وخارطة التنفيذ.",en:"Explain why now, the differentiation, required accreditations, and the roadmap."},
 b:[
 {k:"h",ar:"لماذا الآن؟",en:"Why now?"},
 {k:"ul",ar:["SFDA تشترط أن يكون تدريب GCP لكل الفريق البحثي حديثاً خلال ثلاث سنوات، أي طلب متجدد بحكم النظام.","TransCelerate حدّثت معاييرها في أبريل 2025 لتتوافق مع ICH E6(R3)، ومعظم الرعاة صاروا يطلبون تدريباً يغطي R3.","مراكز التكافؤ ومختبرات التحليل الحيوي تحتاج GLP وممارسات المختبر السريري الجيدة (GCLP).","الأكاديمية لديها بنية تعليم مستمر قائمة."],
  en:["The SFDA requires GCP training no older than three years for the whole team: regulation-driven recurring demand.","TransCelerate updated its criteria in April 2025 for ICH E6(R3); most sponsors now require R3 coverage.","BE centres and bioanalytical labs need GLP and good clinical laboratory practice (GCLP).","The Academy already has a CME infrastructure."]},
 {k:"h",ar:"التميز الحقيقي",en:"Real differentiation"},
 {k:"p",ar:"دورات GCP المجانية المعترف بها موجودة على الإنترنت، فبرنامج «دورة GCP أخرى» لن ينجح. التميز في ثلاثة: محتوى سعودي تنظيمي باللغتين (SFDA والنظام و NCBE)، وتطبيق عملي في موقع تجارب حقيقي، وساعات تعليم مستمر معتمدة من SCFHS، مع اعتراف دولي في نفس الشهادة.",en:"Free recognised GCP courses exist online, so “another GCP course” won’t succeed. Differentiation comes from three things: Saudi regulatory content in both languages, hands-on practice at a real trial site, and SCFHS-accredited CPD hours, plus international recognition on the same certificate."},
 {k:"h",ar:"طبقات الاعتماد",en:"Layers of accreditation"},
 {k:"tbl",h:{ar:["الطبقة","الجهة","ماذا تعطي"],en:["Layer","Body","What it gives"]},
  r:{ar:[["التعليم المستمر الوطني","SCFHS: اعتماد مقدم التعليم المستمر ثم كل نشاط عبر منصة «مستمر»","ساعات يحتاجها الممارس لتجديد تصنيفه"],["قبول الرعاة","TransCelerate: إقرار ذاتي من المزود بمطابقة المعايير الدنيا","قبول الشهادة لدى الرعاة الأعضاء دون إعادة تدريب"],["جودة البرنامج","IAOCR: تقييم المنهجية والمدربين","اعتماد مستقل (ومعروف محلياً لأن KAIMRC حصلت على GCSA منه)"],["GLP","مبادئ OECD وشراكة مع جهة متخصصة","مصداقية المحتوى"],["التواصل التنظيمي","SFDA و NCBE","تعزيز القبول؛ يجب التحقق من وجود مسار رسمي"]],
     en:[["National CPD","SCFHS: CPD provider accreditation, then per activity via Mustamir","Hours needed for re-registration"],["Sponsor acceptance","TransCelerate: provider self-attestation against minimum criteria","Acceptance by member sponsors without retraining"],["Programme quality","IAOCR: methodology and trainer assessment","Independent accreditation (known locally via KAIMRC’s GCSA)"],["GLP","OECD principles and a specialist partner","Content credibility"],["Regulatory engagement","SFDA and NCBE","Stronger acceptance; verify any formal pathway"]]}},
 {k:"note",ar:"معلومة مفيدة: اعتماد النشاط الداخلي لدى SCFHS رسومه الإدارية 1,000 ريال ورسوم الاعتماد 500 ريال، ومدة الخدمة 8 أيام عمل.",en:"Useful fact: SCFHS internal activity accreditation costs a SAR 1,000 admin fee plus SAR 500, with an 8-business-day service time."},
 {k:"h",ar:"المسارات المقترحة",en:"Proposed tracks"},
 {k:"ul",ar:["GCP الأساسي: E6(R3) و SFDA 4.0 والنظام والموافقة والسلامة.","GCP التجديدي: التحديثات والفروق بين R2 و R3 وأخطاء التفتيش.","مسارات حسب الدور: الباحث، المنسق، المراقب، أعضاء اللجنة.","GLP لمختبرات ما قبل السريري والجودة، و GCLP لمختبرات التحليل الحيوي.","أخلاقيات البحث، وهي شرط نظامي لكل باحث."],
  en:["GCP Foundation: E6(R3), SFDA 4.0, the law, consent, safety.","GCP Refresher: updates, R2 vs R3, inspection findings.","Role-based: PI, coordinator, monitor, IRB members.","GLP for preclinical and quality labs; GCLP for bioanalytical labs.","Research ethics, a legal requirement for every researcher."]},
 {k:"h",ar:"خارطة التنفيذ",en:"Roadmap"},
 {k:"tbl",h:{ar:["المرحلة","المدة","المخرج"],en:["Phase","Duration","Output"]},
  r:{ar:[["الأساس الداخلي","0–6 أشهر","كل فرق المجموعة بشهادات حديثة وساعات SCFHS"],["الاعتراف والتوسع","6–12 شهراً","إقرار TransCelerate وفتح البرنامج للخارج كمصدر إيراد"],["المختبرات والجودة","12–24 شهراً","GLP و GCLP واعتماد IAOCR"]],
     en:[["Internal foundation","0–6 months","All internal teams certified with SCFHS hours"],["Recognition and expansion","6–12 months","TransCelerate attestation; opened externally as revenue"],["Labs and quality","12–24 months","GLP, GCLP, IAOCR accreditation"]]}},
 {k:"warn",ar:"قبل الطرح: لا تقولي «لا يوجد مركز معتمد في المملكة» بشكل مطلق قبل مراجعة قائمة TransCelerate. ولا تعدي بأي اعتماد قبل صدوره.",en:"Before pitching: don’t say “no accredited centre in KSA” before checking TransCelerate’s list, and don’t promise any accreditation before it’s granted."}
 ],

  {q:{ar:"ما الطبقة التي تعطي أقوى حافز للتسجيل في البرنامج محلياً؟",en:"Which layer gives the strongest local enrolment incentive?"},a:{ar:"ساعات التعليم المستمر من SCFHS، لأن الممارس يحتاجها لتجديد تصنيفه.",en:"SCFHS CPD hours, needed for re-registration."}},
  {q:{ar:"كيف تعترف TransCelerate بالدورة؟",en:"How does TransCelerate recognise a course?"},a:{ar:"بإقرار ذاتي من المزود بمطابقة المعايير الدنيا؛ هي لا تكتب التدريب ولا تقدمه.",en:"Provider self-attestation against minimum criteria; it neither writes nor delivers training."}},
  {q:{ar:"لماذا لن ينجح البرنامج لو كان دورة GCP عادية؟",en:"Why would a plain GCP course fail?"},a:{ar:"لوجود دورات مجانية معترف بها؛ التميز يجب أن يأتي من المحتوى السعودي والتطبيق العملي وساعات CPD.",en:"Free recognised courses exist; value must come from Saudi content, hands-on practice, and CPD hours."}}
 ]},

 goal:{ar:"تفرقين بين الأنظمة ووظائفها، وتعرفين منظومة مركز التكافؤ، ومعايير الاختيار والامتثال.",en:"Distinguish the systems and their functions, the BE centre stack, and selection and compliance criteria."},

 {k:"p",ar:"الأنظمة في البيئة المنظمة يجب أن تتوافق مع Part 11 الأمريكي للسجلات والتوقيعات الإلكترونية، و Annex 11 الأوروبي، وإطار GAMP 5 للتحقق حسب المخاطر، و ICH E6(R3). وفي المملكة: نظام حماية البيانات الشخصية وضوابط الهيئة الوطنية للأمن السيبراني عند الاستضافة السحابية. والبيانات يجب أن تكون: منسوبة، ومقروءة، وآنية، وأصلية، ودقيقة، وكاملة، ومتسقة، ودائمة، ومتاحة (ALCOA+).",en:"Regulated systems must meet US Part 11 for electronic records and signatures, EU Annex 11, the GAMP 5 risk-based validation framework, and ICH E6(R3). In KSA: the Personal Data Protection Law and National Cybersecurity Authority controls for cloud hosting. Data must be Attributable, Legible, Contemporaneous, Original, Accurate, Complete, Consistent, Enduring, and Available (ALCOA+)."},

function esc(s){return String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}
function navs(){
  ["rail","tabs"].forEach(id=>{
    const n=document.getElementById(id);
    n.innerHTML=ORDER.map(k=>`<button type="button" data-v="${k}" aria-current="${k===current}">${T(UI.nav[k])}</button>`).join("");
    n.querySelectorAll("button").forEach(b=>b.onclick=()=>go(b.dataset.v));
  });
}
function go(v){current=v;store.set("view",v);render();window.scrollTo({top:0});}
function checklistStats(){const done=store.get("check",{});let total=0,n=0;CHECK.forEach((g,gi)=>g.items.forEach((_,ii)=>{total++;if(done[gi+"-"+ii])n++}));return{n,total};}
function listHTML(arr){return "<ul>"+arr.map(x=>`<li>${esc(T(x))}</li>`).join("")+"</ul>";}
function tableHTML(h,r){return `<div class="tbl"><table><thead><tr>${h.map(x=>`<th>${esc(x)}</th>`).join("")}</tr></thead><tbody>${r.map(row=>`<tr>${row.map((c,i)=>i===0?`<th>${esc(c)}</th>`:`<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;}

 ${TOPICS.map((tp,i)=>`<details${i===0?" open":""}><summary>${esc(T(tp.t))}</summary><div class="inner">
  ${tp.b?listHTML(tp.b[L].map(x=>({ar:x,en:x}))):""}
  ${tp.table?tableHTML(tp.table.h[L],tp.table.r[L]):""}
  ${tp.extra?listHTML(tp.extra[L].map(x=>({ar:x,en:x}))):""}
  <div class="strong">${esc(T(tp.s))}</div></div></details>`).join("")}`;

let rq={cat:"all",i:0,list:null};let timer={left:90,run:false,h:null};
function rList(){return QS.map((q,i)=>({...q,idx:i})).filter(q=>rq.cat==="all"||q.c===rq.cat);}
V.rehearse=()=>{rq.list=rList();if(rq.i>=rq.list.length)rq.i=0;const q=rq.list[rq.i];const prac=store.get("prac",{});
 return `<h2>${T(UI.nav.rehearse)}</h2><p class="lead">${L==="ar"?"اقرئي السؤال، شغّلي المؤقت، وأجيبي بصوت عالي خلال 90 ثانية. ثم قارني بالإجابة النموذجية.":"Read the question, start the timer, answer aloud within 90 seconds, then compare with the model answer."}</p>
 <div class="filters">${[["all",{ar:"الكل",en:"All"}],...Object.entries(CATS)].map(([k,v])=>`<button class="chip" type="button" data-cat="${k}" aria-pressed="${rq.cat===k}">${esc(T(v))}</button>`).join("")}</div>
 <div class="stage"><span class="tag">${esc(T(CATS[q.c]))}</span>${prac[q.idx]?`<span class="tag">${L==="ar"?"تدربتِ عليه":"Practised"}</span>`:""}
  <p class="q">${esc(T(q.q))}</p>
  <div class="stagebar"><div class="ring"><svg width="74" height="74"><circle cx="37" cy="37" r="32" stroke="var(--glass)" stroke-width="7" fill="none"/><circle id="arc" cx="37" cy="37" r="32" stroke="var(--amber)" stroke-width="7" fill="none" stroke-dasharray="201" stroke-dashoffset="${201*(1-timer.left/90)}" stroke-linecap="round"/></svg><div class="num" id="tnum">${timer.left}</div></div>
   <button class="btn small" id="tgo" type="button">${timer.run?(L==="ar"?"إيقاف":"Pause"):(L==="ar"?"ابدئي المؤقت":"Start timer")}</button>
   <button class="btn small ghost" id="treset" type="button">${L==="ar"?"إعادة":"Reset"}</button>
   <button class="btn small ghost" id="reveal" type="button">${L==="ar"?"اعرضي الإجابة النموذجية":"Show model answer"}</button></div>
  <div class="answer" id="ans"><div class="strong">${esc(T(q.a))}</div>
   <button class="btn small" id="mark" type="button">${prac[q.idx]?(L==="ar"?"إلغاء علامة التدرب":"Unmark practised"):(L==="ar"?"علّميه كمتدرَّب عليه":"Mark as practised")}</button></div>
 </div>
 <div class="navrow"><button class="btn ghost small" id="prev" type="button">${L==="ar"?"السابق":"Previous"}</button><button class="btn small" id="next" type="button">${L==="ar"?"التالي":"Next"}</button><button class="btn ghost small" id="shuf" type="button">${L==="ar"?"سؤال عشوائي":"Random question"}</button><span class="count">${rq.i+1} / ${rq.list.length}</span></div>`;};
function bindRehearse(){
 main.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{rq.cat=b.dataset.cat;rq.i=0;resetTimer();render();});
 const q=rq.list[rq.i];
 document.getElementById("reveal").onclick=()=>document.getElementById("ans").classList.toggle("show");
 document.getElementById("mark").onclick=()=>{const p=store.get("prac",{});if(p[q.idx])delete p[q.idx];else p[q.idx]=1;store.set("prac",p);render();document.getElementById("ans").classList.add("show");};
 document.getElementById("prev").onclick=()=>{rq.i=(rq.i-1+rq.list.length)%rq.list.length;resetTimer();render();};
 document.getElementById("next").onclick=()=>{rq.i=(rq.i+1)%rq.list.length;resetTimer();render();};
 document.getElementById("shuf").onclick=()=>{rq.i=Math.floor(Math.random()*rq.list.length);resetTimer();render();};
 document.getElementById("tgo").onclick=()=>{if(timer.run){clearInterval(timer.h);timer.run=false;}else{timer.run=true;timer.h=setInterval(()=>{timer.left=Math.max(0,timer.left-1);const n=document.getElementById("tnum"),a=document.getElementById("arc");if(n)n.textContent=timer.left;if(a)a.setAttribute("stroke-dashoffset",201*(1-timer.left/90));if(timer.left===0){clearInterval(timer.h);timer.run=false;const b=document.getElementById("tgo");if(b)b.textContent=L==="ar"?"ابدئي المؤقت":"Start timer";}},1000);}document.getElementById("tgo").textContent=timer.run?(L==="ar"?"إيقاف":"Pause"):(L==="ar"?"ابدئي المؤقت":"Start timer");};
 document.getElementById("treset").onclick=()=>{resetTimer();render();};
}
function resetTimer(){clearInterval(timer.h);timer.run=false;timer.left=90;}

let fc={i:0,order:CARDS.map((_,i)=>i)};
V.cards=()=>{const c=CARDS[fc.order[fc.i]];return `<h2>${T(UI.nav.cards)}</h2><p class="lead">${L==="ar"?"اضغطي على البطاقة لقلبها.":"Tap the card to flip it."}</p>
 <div class="flip"><div class="fc" id="fc" role="button" tabindex="0" aria-label="flip"><div class="face"><b class="ltr">${esc(c[0])}</b></div><div class="face back">${esc(L==="ar"?c[1]:c[2])}</div></div></div>
 <div class="navrow"><button class="btn ghost small" id="fprev" type="button">${L==="ar"?"السابقة":"Previous"}</button><button class="btn small" id="fnext" type="button">${L==="ar"?"التالية":"Next"}</button><button class="btn ghost small" id="fshuf" type="button">${L==="ar"?"خلط البطاقات":"Shuffle"}</button><span class="count">${fc.i+1} / ${CARDS.length}</span></div>`;};
function bindCards(){const el=document.getElementById("fc");const flip=()=>el.classList.toggle("turn");el.onclick=flip;el.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();flip();}};
 document.getElementById("fprev").onclick=()=>{fc.i=(fc.i-1+CARDS.length)%CARDS.length;render();};
 document.getElementById("fnext").onclick=()=>{fc.i=(fc.i+1)%CARDS.length;render();};
 document.getElementById("fshuf").onclick=()=>{fc.order.sort(()=>Math.random()-.5);fc.i=0;render();};}

let qz={i:0,score:0,answered:false,done:false};
V.quiz=()=>{if(qz.done){const pct=Math.round(100*qz.score/QUIZ.length);const best=store.get("best",0);if(pct>best)store.set("best",pct);
  return `<h2>${T(UI.nav.quiz)}</h2><div class="stage"><p class="q">${L==="ar"?"نتيجتك":"Your score"}: <span class="ltr">${qz.score}/${QUIZ.length} (${pct}%)</span></p>
  <div class="${pct>=80?"strong":"warn"}">${pct>=80?(L==="ar"?"ممتاز. أنتِ جاهزة في هذا الجزء.":"Excellent. You’re ready on this part."):(L==="ar"?"راجعي «الملخصات» ثم أعيدي المحاولة. الهدف 80% أو أكثر.":"Review the summaries and try again. Aim for 80% or more.")}</div>
  <button class="btn" id="qre" type="button">${L==="ar"?"أعيدي الاختبار":"Retake the quiz"}</button></div>`;}
 const q=QUIZ[qz.i];const opts=Array.isArray(q.o)?q.o:q.o[L];
 return `<h2>${T(UI.nav.quiz)}</h2><p class="lead">${L==="ar"?"عشرون سؤالاً من محتوى المستندات والمعلومات الحديثة.":"Twenty questions from the documents and the latest research."}</p>
 <div class="stage"><span class="count">${qz.i+1} / ${QUIZ.length}</span><p class="q">${esc(T(q.q))}</p>
 ${opts.map((o,i)=>`<button class="opt" type="button" data-o="${i}">${esc(o)}</button>`).join("")}
 <div class="expl" id="expl"><div class="box">${esc(T(q.x))}</div><button class="btn small" id="qnext" type="button">${qz.i+1<QUIZ.length?(L==="ar"?"السؤال التالي":"Next question"):(L==="ar"?"اعرضي النتيجة":"See score")}</button></div></div>`;};
function bindQuiz(){if(qz.done){document.getElementById("qre").onclick=()=>{qz={i:0,score:0,answered:false,done:false};render();};return;}
 const q=QUIZ[qz.i];main.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(qz.answered)return;qz.answered=true;const k=+b.dataset.o;
  main.querySelectorAll(".opt")[q.c].classList.add("right");if(k!==q.c)b.classList.add("wrong");else qz.score++;document.getElementById("expl").classList.add("show");});
 document.getElementById("qnext").onclick=()=>{qz.answered=false;if(qz.i+1<QUIZ.length)qz.i++;else qz.done=true;render();};}

V.ideas=()=>`<h2>${T(UI.nav.ideas)}</h2><p class="lead">${L==="ar"?"ثلاث أفكار تطرحينها كقيمة مضافة. اطرحيها كحل لمشكلة لديهم، بصيغة «أقترح».":"Three ideas to offer as added value. Frame each as a solution to their need, using “I propose”."}</p>
 ${IDEAS.map(d=>`<details open><summary>${esc(T(d.t))}</summary><div class="inner">
 <p><b>${L==="ar"?"لماذا:":"Why:"}</b> ${esc(T(d.why))}</p>
 <p><b>${L==="ar"?"كيف:":"How:"}</b></p>${listHTML(d.how[L].map(x=>({ar:x,en:x})))}
 <div class="strong"><b>${L==="ar"?"قوليها هكذا:":"Say it like this:"}</b> ${esc(T(d.say))}</div></div></details>`).join("")}
 <h3>${L==="ar"?"خطة أول 90 يوماً":"First 90 days"}</h3><div class="box"><ul>
 <li>${L==="ar"?"الشهر الأول: الاستماع وفهم الوضع وقياس المؤشرات الأساسية.":"Month 1: listen, map the current state, baseline KPIs."}</li>
 <li>${L==="ar"?"الشهر الثاني: الاتفاق على ثلاث فرص سريعة مع أصحاب القرار.":"Month 2: agree three quick wins with decision-makers."}</li>
 <li>${L==="ar"?"الشهر الثالث: تنفيذ أولها وتقديم تصور لأحد المقترحات حسب الأولوية.":"Month 3: deliver the first and present one proposal by priority."}</li></ul></div>`;

V.check=()=>{const done=store.get("check",{});const s=checklistStats();
 return `<h2>${T(UI.nav.check)}</h2><p class="lead">${L==="ar"?"تُحفظ علاماتك على هذا الجهاز.":"Your ticks are saved on this device."}</p>
 <div class="pbar"><i style="width:${Math.round(100*s.n/s.total)}%"></i></div><span class="count">${s.n} / ${s.total}</span>
 ${CHECK.map((g,gi)=>`<h3>${esc(T(g.g))}</h3><div class="box" style="padding:4px 6px">${g.items.map((it,ii)=>{const k=gi+"-"+ii;return `<div class="chk${done[k]?" done":""}"><input type="checkbox" id="c${k}" data-k="${k}"${done[k]?" checked":""}><label for="c${k}">${esc(T(it))}</label></div>`}).join("")}</div>`).join("")}
 <div class="go"><button class="btn ghost small" id="creset" type="button">${L==="ar"?"مسح كل العلامات":"Clear all ticks"}</button></div>`;};
function bindCheck(){main.querySelectorAll("input[data-k]").forEach(c=>c.onchange=()=>{const d=store.get("check",{});if(c.checked)d[c.dataset.k]=1;else delete d[c.dataset.k];store.set("check",d);render();});
 document.getElementById("creset").onclick=()=>{store.set("check",{});render();};}


let st={open:null};
function blockHTML(x){
 if(x.k==="h")return `<h3>${esc(T(x))}</h3>`;
 if(x.k==="p")return `<p>${esc(T(x))}</p>`;
 if(x.k==="ul")return "<ul>"+x[L].map(i=>`<li>${esc(i)}</li>`).join("")+"</ul>";
 if(x.k==="ol")return "<ol>"+x[L].map(i=>`<li>${esc(i)}</li>`).join("")+"</ol>";
 if(x.k==="tbl")return tableHTML(x.h[L],x.r[L]);
 if(x.k==="note")return `<div class="strong">${esc(T(x))}</div>`;
 if(x.k==="warn")return `<div class="warn">${esc(T(x))}</div>`;
 return "";}
V.study=()=>{const les=store.get("les",{});
 if(st.open===null){return `<h2>${T(UI.nav.study)}</h2><p class="lead">${L==="ar"?"عشرة دروس مفصلة تغطي كل ما جمعناه. في آخر كل درس أسئلة «اختبري نفسك». علّمي الدرس كمنتهٍ عندما تجيبين عليها كلها.":"Ten detailed lessons covering everything we gathered. Each ends with a self-check; mark a lesson done once you can answer them all."}</p>
 ${LESSONS.map((l,i)=>`<button class="lesson${les[l.id]?" done":""}" type="button" data-l="${i}"><span class="n">${les[l.id]?"✓":i+1}</span><span><b>${esc(T(l.t))}</b><span>${esc(T(l.goal))}</span></span></button>`).join("")}`;}
 const l=LESSONS[st.open];
 return `<div class="reader"><button class="btn ghost small" id="back" type="button">${L==="ar"?"كل الدروس":"All lessons"}</button>
 <h2 style="margin-top:14px">${esc(T(l.t))}</h2><div class="goal"><b>${L==="ar"?"الهدف: ":"Goal: "}</b>${esc(T(l.goal))}</div>
 ${l.b.map(blockHTML).join("")}
 <h3>${L==="ar"?"اختبري نفسك":"Check yourself"}</h3><div class="box">${l.self.map((q,i)=>`<div class="selfq"><b>${esc(T(q.q))}</b><div><button class="btn ghost small" type="button" data-s="${i}" style="margin-top:6px">${L==="ar"?"اعرضي الإجابة":"Show answer"}</button></div><div class="ans" id="sa${i}">${esc(T(q.a))}</div></div>`).join("")}</div>
 <div class="navrow"><button class="btn small" id="ldone" type="button">${les[l.id]?(L==="ar"?"إلغاء علامة الإنهاء":"Mark not done"):(L==="ar"?"أنهيتُ هذا الدرس":"Mark lesson done")}</button>
 <button class="btn ghost small" id="lprev" type="button"${st.open===0?" disabled":""}>${L==="ar"?"الدرس السابق":"Previous lesson"}</button>
 <button class="btn ghost small" id="lnext" type="button"${st.open===LESSONS.length-1?" disabled":""}>${L==="ar"?"الدرس التالي":"Next lesson"}</button>
 <span class="count">${st.open+1} / ${LESSONS.length}</span></div></div>`;};
function bindStudy(){
 if(st.open===null){main.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{st.open=+b.dataset.l;render();window.scrollTo({top:0});});return;}
 const l=LESSONS[st.open];
 document.getElementById("back").onclick=()=>{st.open=null;render();window.scrollTo({top:0});};
 main.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>document.getElementById("sa"+b.dataset.s).classList.toggle("show"));
 document.getElementById("ldone").onclick=()=>{const d=store.get("les",{});if(d[l.id])delete d[l.id];else d[l.id]=1;store.set("les",d);render();};
 document.getElementById("lprev").onclick=()=>{if(st.open>0){st.open--;render();window.scrollTo({top:0});}};
 document.getElementById("lnext").onclick=()=>{if(st.open<LESSONS.length-1){st.open++;render();window.scrollTo({top:0});}};}
let gq="";
V.gloss=()=>`<h2>${T(UI.nav.gloss)}</h2><p class="lead">${L==="ar"?`${GLOSS.length} مصطلحاً مرتبة أبجدياً. ابحثي بالعربي أو الإنجليزي.`:`${GLOSS.length} terms, alphabetical. Search in Arabic or English.`}</p>
 <input class="search" id="gsearch" type="search" placeholder="${L==="ar"?"ابحثي عن مصطلح…":"Search a term…"}" value="${esc(gq)}">
 <div class="tbl"><table><thead><tr><th>${L==="ar"?"المصطلح":"Term"}</th><th>${L==="ar"?"المعنى":"Meaning"}</th></tr></thead><tbody id="gbody"></tbody></table></div>`;
function bindGloss(){const inp=document.getElementById("gsearch"),body=document.getElementById("gbody");
 const draw=()=>{const q=gq.trim().toLowerCase();body.innerHTML=GLOSS.filter(g=>!q||g.join(" ").toLowerCase().includes(q)).map(g=>`<tr><th class="ltr">${esc(g[0])}</th><td>${esc(L==="ar"?g[1]:g[2])}</td></tr>`).join("")||`<tr><td colspan="2">${L==="ar"?"لا توجد نتائج. جربي كلمة أخرى.":"No matches. Try another word."}</td></tr>`;};
 inp.oninput=()=>{gq=inp.value;draw();};draw();}

function render(){
 document.documentElement.lang=L;document.documentElement.dir=L==="ar"?"rtl":"ltr";
 document.title=T(UI.title);document.getElementById("apptitle").textContent=T(UI.title);document.getElementById("langBtn").textContent=T(UI.lang);
 navs();
 main.innerHTML=`<section class="view on">${V[current]()}</section>`;
 main.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
 if(current==="study")bindStudy();if(current==="gloss")bindGloss();if(current==="rehearse")bindRehearse();if(current==="cards")bindCards();if(current==="quiz")bindQuiz();if(current==="check")bindCheck();
}
document.getElementById("langBtn").onclick=()=>{L=L==="ar"?"en":"ar";store.set("lang",L);render();};
if(!V[current])current="home";
render();
</script>
</body>
</html>
