<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تجهيز مقابلة د. مرام سندوقة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0E3B43; --ink-2:#1F5560; --glass:#EAF2F0; --paper:#F7FAF9; --line:#C9D8D4;
  --muted:#5E7470; --amber:#C98A12; --amber-bg:#FBF1DC; --ox:#8C2F39; --ox-bg:#F6E4E6;
  --ok:#2E7D5B; --ok-bg:#E1F2EA; --card:#FFFFFF; --text:#12282C;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ink:#8FD0CB; --ink-2:#6FB6B0; --glass:#132A2E; --paper:#0D1E21; --line:#2A4549;
    --muted:#93ABA7; --amber:#E6B24A; --amber-bg:#3A2F17; --ox:#E58C95; --ox-bg:#3A1E22;
    --ok:#7ED1A8; --ok-bg:#16352A; --card:#15292C; --text:#E4EFED;
  }
}
:root[data-theme="dark"]{
  --ink:#8FD0CB; --ink-2:#6FB6B0; --glass:#132A2E; --paper:#0D1E21; --line:#2A4549;
  --muted:#93ABA7; --amber:#E6B24A; --amber-bg:#3A2F17; --ox:#E58C95; --ox-bg:#3A1E22;
  --ok:#7ED1A8; --ok-bg:#16352A; --card:#15292C; --text:#E4EFED;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--paper);color:var(--text);
  font-family:"IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;font-size:16px;line-height:1.75}
button{font:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--ink);color:#fff;
  display:flex;align-items:center;gap:12px;padding:10px 18px}
:root[data-theme="dark"] .top{color:#0D1E21}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .top{color:#0D1E21}}
.top h1{font-size:1.05rem;margin:0;font-weight:600;flex:1}
.top button{background:transparent;border:1px solid currentColor;color:inherit;border-radius:6px;padding:4px 12px;font-size:.9rem}
.shell{display:flex;max-width:1200px;margin:0 auto}
nav.rail{position:sticky;top:56px;align-self:flex-start;width:230px;padding:18px 12px;flex-shrink:0}
nav.rail button{display:block;width:100%;text-align:start;background:none;border:none;color:var(--text);
  padding:9px 12px;border-radius:6px;margin-bottom:2px;font-size:.97rem}
nav.rail button[aria-current="true"]{background:var(--glass);color:var(--ink);font-weight:600;
  box-shadow:inset 3px 0 0 var(--ink)}
[dir="rtl"] nav.rail button[aria-current="true"]{box-shadow:inset -3px 0 0 var(--ink)}
main{flex:1;min-width:0;padding:22px 22px 110px}
.view{display:none;max-width:820px}
.view.on{display:block}
h2{font-size:1.7rem;line-height:1.35;margin:4px 0 6px;color:var(--ink);font-weight:700}
h3{font-size:1.18rem;margin:26px 0 8px;color:var(--ink-2);font-weight:600}
p.lead{color:var(--muted);margin:0 0 18px}
.box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin:12px 0}
.strong{background:var(--amber-bg);border-inline-start:4px solid var(--amber);border-radius:6px;padding:12px 16px;margin:12px 0}
.warn{background:var(--ox-bg);border-inline-start:4px solid var(--ox);border-radius:6px;padding:12px 16px;margin:12px 0}
.tag{display:inline-block;font-size:.8rem;padding:1px 9px;border-radius:20px;background:var(--glass);color:var(--ink);margin-inline-end:6px}
ul{padding-inline-start:22px;margin:6px 0}
li{margin:4px 0}
.ltr{direction:ltr;unicode-bidi:isolate}
/* Hero */
.hero{padding:26px 0 8px}
.hero .who{font-size:2.3rem;font-weight:700;line-height:1.2;color:var(--ink);margin:0}
.hero .what{font-size:1.1rem;color:var(--muted);margin:6px 0 18px}
.meters{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}
.meter{border-top:3px solid var(--ink);padding-top:8px}
.meter b{font-size:1.6rem;display:block;color:var(--ink)}
.meter span{font-size:.88rem;color:var(--muted)}
.go{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.btn{background:var(--ink);color:var(--paper);border:none;border-radius:8px;padding:10px 18px;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn.small{padding:6px 12px;font-size:.9rem;font-weight:500}
/* facts */
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.fact{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.fact b{display:block;font-size:1.25rem;color:var(--ink)}
.fact span{font-size:.92rem}
/* accordion */
details{background:var(--card);border:1px solid var(--line);border-radius:10px;margin:10px 0}
summary{padding:14px 16px;font-weight:600;cursor:pointer;color:var(--ink);list-style:none;display:flex;justify-content:space-between;gap:10px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-size:1.3rem;line-height:1}
details[open] summary::after{content:"−"}
details .inner{padding:0 18px 14px}
.tbl{overflow-x:auto;margin:10px 0}
table{border-collapse:collapse;width:100%;font-size:.93rem}
th,td{border:1px solid var(--line);padding:7px 10px;text-align:start;vertical-align:top}
th{background:var(--glass);color:var(--ink)}
/* rehearse */
.stage{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;margin-top:12px}
.stage .q{font-size:1.45rem;font-weight:600;line-height:1.5;margin:10px 0 18px;color:var(--text)}
.stagebar{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.ring{width:74px;height:74px;position:relative;flex-shrink:0}
.ring svg{transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--ink);font-size:1.05rem}
.answer{display:none;margin-top:16px;border-top:1px dashed var(--line);padding-top:14px}
.answer.show{display:block}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 4px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:20px;padding:4px 13px;font-size:.9rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.navrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;align-items:center}
.count{color:var(--muted);font-size:.9rem;margin-inline-start:auto}
/* flashcards */
.flip{perspective:1200px;margin-top:14px}
.fc{position:relative;height:260px;transition:transform .5s;transform-style:preserve-3d;cursor:pointer}
.fc.turn{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;font-size:1.3rem;line-height:1.55;background:var(--card)}
.face.back{transform:rotateY(180deg);background:var(--glass);font-size:1.08rem}
@media (prefers-reduced-motion:reduce){.fc{transition:none}}
/* quiz */
.opt{display:block;width:100%;text-align:start;background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:10px 14px;margin:7px 0;color:var(--text)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--ox);background:var(--ox-bg)}
.expl{margin-top:10px;display:none}
.expl.show{display:block}
/* checklist */
.chk{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border-bottom:1px solid var(--line)}
.chk input{width:20px;height:20px;margin-top:5px;accent-color:var(--ink);flex-shrink:0}
.chk.done label{color:var(--muted);text-decoration:line-through}
.chk small{display:block;color:var(--muted);text-decoration:none}
.pbar{height:8px;background:var(--glass);border-radius:6px;overflow:hidden;margin:6px 0 14px}
.pbar i{display:block;height:100%;background:var(--ink);width:0}
.meters{grid-template-columns:repeat(4,1fr)}
.lesson{display:flex;gap:14px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:10px 0;width:100%;text-align:start;color:var(--text)}
.lesson:hover{border-color:var(--ink)}
.lesson .n{flex-shrink:0;width:34px;height:34px;border-radius:50%;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--ink)}
.lesson.done .n{background:var(--ink);color:var(--paper)}
.lesson b{display:block;color:var(--ink);font-size:1.05rem}
.lesson span{font-size:.92rem;color:var(--muted)}
.reader p{margin:8px 0 12px}
.reader ol{padding-inline-start:24px}
.goal{background:var(--glass);border-radius:8px;padding:12px 16px;margin:10px 0 6px}
.selfq{border-bottom:1px solid var(--line);padding:10px 0}
.selfq .ans{display:none;margin-top:8px;color:var(--ok);font-weight:500}
.selfq .ans.show{display:block}
.search{width:100%;padding:10px 14px;border:1.5px solid var(--line);border-radius:8px;font:inherit;background:var(--card);color:var(--text);margin:8px 0 12px}
/* mobile nav */
nav.tabs{display:none}
@media (max-width:860px){
  nav.rail{display:none}
  main{padding:16px 14px 120px}
  nav.tabs{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--card);border-top:1px solid var(--line);
    overflow-x:auto;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
  nav.tabs button{flex:0 0 auto;background:none;border:none;color:var(--muted);padding:8px 12px;font-size:.88rem;border-radius:6px;white-space:nowrap}
  nav.tabs button[aria-current="true"]{color:var(--ink);background:var(--glass);font-weight:600}
  .hero .who{font-size:1.8rem}
  .stage .q{font-size:1.2rem}
  .meters{grid-template-columns:1fr 1fr}
  .meter b{font-size:1.25rem}
}
@media print{nav,.top,.go,.navrow{display:none}.view{display:block!important}}
</style>
</head>

  extra:{ar:["التسجيل في SCTR إلزامي لكل الدراسات، ولا يعني الموافقة.","رسوم 15,000 ريال؛ تُعفى الحكومية وغير الممولة والمرحلة الرابعة.","المرحلة الرابعة التي تتضمن استطباباً جديداً أو تغيير جرعة أو شكل صيدلاني تحتاج موافقة كاملة.","إخطار الهيئة خلال 60 يوماً عند الإغلاق، والتقرير النهائي خلال سنة (ICH E3).","مسار الاعتماد (Reliance): تسريع إذا اعتمدت الدراسة FDA أو EMA أو MHRA أو Swissmedic.","المراقب لا يجوز أن يكون من الفريق البحثي."],
     en:["SCTR registration is mandatory for all studies and does not mean approval.","SAR 15,000 fee; waived for government-sponsored, unsponsored, and Phase IV.","Phase IV with a new indication, dose, or dosage form needs full approval.","Notify the SFDA within 60 days of close-out; final report within one year (ICH E3).","Reliance pathway: faster review if approved by FDA, EMA, MHRA, or Swissmedic.","The monitor must not be part of the research team."]},
  s:{ar:"المدد تُحسب بعد اكتمال المستندات، وتتوقف أثناء رد مقدم الطلب.",en:"Timelines start after complete documentation and pause during applicant responses."}},
 {t:{ar:"التكافؤ الحيوي",en:"Bioequivalence"},
  b:{ar:["التعريف: مستحضران بنفس المادة والجرعة (جنيس ومرجعي) يصلان للدم بمعدل وكمية متقاربين بحيث لا يُتوقع فرق سريري.","المؤشرات: Cmax (معدل الامتصاص)، و AUC (كمية الامتصاص)، و Tmax (داعم).","القبول: فترة الثقة 90% لنسبة المتوسط الهندسي لـ AUC و Cmax ضمن 80.00–125.00%.","عالية التباين (CV ≥ 30%): في إرشادات EMA يمكن توسيع حدود Cmax فقط حتى 69.84–143.19% بتصميم متكرر.","ضيقة المؤشر العلاجي: حدود أضيق. الإعفاء الحيوي: حسب BCS والذوبان.","التصميم: عشوائي متقاطع 2x2، غسيل ≥ 5 أضعاف عمر النصف، صائمين أو بعد وجبة.","المكونات: الشق السريري، والتحليلي (LC-MS/MS و GLP)، والإحصائي والحرائكي.","الأخلاقيات: تعويض بدون إغراء، سجل مركزي يمنع المشاركة المتكررة، موافقة بلغة مفهومة، حق الانسحاب."],
     en:["Definition: two products with the same ingredient and strength (generic vs reference) reach the blood at a similar rate and extent, so no clinical difference is expected.","Parameters: Cmax (rate), AUC (extent), Tmax (supportive).","Acceptance: 90% CI of the GMR for AUC and Cmax within 80.00–125.00%.","Highly variable (CV ≥ 30%): under EMA, Cmax limits only may widen up to 69.84–143.19% with a replicate design.","NTI drugs: tighter limits. Biowaiver: based on BCS and dissolution.","Design: randomised 2x2 crossover, washout ≥ 5 half-lives, fasting or fed.","Pillars: clinical, bioanalytical (LC-MS/MS under GLP), PK and statistics.","Ethics: fair pay without undue inducement, central registry against over-volunteering, plain-language consent, right to withdraw."]},
  s:{ar:"80–125% لا تعني السماح بفرق 20%. المتوسطان يجب أن يكونا قريبين جداً حتى تقع فترة الثقة كاملة داخل الحدود.",en:"80–125% does not allow a 20% difference. The means must be very close for the whole interval to fit."}},
 {t:{ar:"أطراف المنظومة: الراعي، الباحث، CRO، الشركة",en:"Parties: sponsor, investigator, CRO, company"},
  b:{ar:["الشركة الدوائية: صاحبة المنتج، تصنّعه وفق GMP، وغالباً هي الراعي، وتسجّل الدواء بعد التجربة.","الراعي: يبدأ التجربة ويديرها ويمولها، ويتحمل المسؤولية النهائية عن الجودة ونزاهة البيانات.","CRO: تنفذ مهام الراعي بعقد. الراعي بلا وجود رسمي في المملكة يمكنه تفويض CRO أو الباحث الرئيس.","الباحث الرئيس: المسؤول في الموقع عن سلامة المشاركين والموافقة المستنيرة ودقة البيانات؛ يوقّع Form 4 ويفصح عن مصالحه (Form 3).","مسار السلامة: الباحث يبلغ الراعي فوراً ← الراعي يقيّم ← SUSAR للهيئة خلال 15 يوماً (7 إذا مميت أو مهدد للحياة)."],
     en:["Pharma company: owns and manufactures the product under GMP, usually the sponsor, registers the drug after the trial.","Sponsor: initiates, manages, funds; holds ultimate responsibility for quality and data integrity.","CRO: performs sponsor tasks under contract. A sponsor without a KSA presence can authorise a CRO or the PI.","PI: accountable on site for participant safety, consent, and data accuracy; signs Form 4 and discloses interests (Form 3).","Safety flow: PI reports to sponsor immediately → sponsor assesses → SUSAR to SFDA within 15 days (7 if fatal or life-threatening)."]},
  s:{ar:"القاعدة الذهبية: الراعي ينقل المهام، ولا ينقل المسؤولية النهائية.",en:"Golden rule: the sponsor can delegate tasks, never ultimate responsibility."}},
 {t:{ar:"نموذج KAIMRC",en:"The KAIMRC model"},
  b:{ar:["إدارة التجارب السريرية فيها: وحدة الأدوية التجريبية، والمراقبة وضمان الجودة، ووحدة المرحلة الأولى (تقدمها KAIMRC كالوحيدة المعتمدة من SFDA)، ومكتب التعزيز والتواصل.","CRO تعمل للراعي؛ SMO تعمل للموقع والباحث. إدارة KAIMRC تلبس القبعتين حسب الراعي، وتبقى منفصلة عن الباحث.","إنجازات منشورة: اعتماد AAHRPP (2023)، وشهادة GCSA من IAOCR (يونيو 2025، أول شبكة مواقع في المملكة)، وشراكة Flagship Pioneering (نوفمبر 2025)."],
     en:["Its Clinical Trial Management includes an Investigational Drug Unit, Monitoring and QA, a Phase 1 unit (presented by KAIMRC as the only SFDA-accredited one), and a promotion office.","A CRO works for the sponsor; an SMO works for the site and PI. KAIMRC wears either hat depending on the sponsor, always separate from the PI.","Published achievements: AAHRPP (2023), IAOCR GCSA (June 2025, first site network in KSA), Flagship Pioneering MOU (November 2025)."]},
  s:{ar:"«الحبيب تحتاج نفس المبدأ: الباحثون في الأقسام من جهة، ومكتب مركزي يدعم الموقع ويشغّل المراقبة المستقلة من جهة أخرى.»",en:"“Al Habib needs the same principle: investigators in departments on one side, a central office supporting the site and running independent monitoring on the other.”"}},
 {t:{ar:"الأنظمة الرقمية: CTMS و LIMS وغيرها",en:"Digital systems: CTMS, LIMS and more"},
  b:{ar:["CTMS يدير العمليات (المواقع، المراحل، الاستقطاب، المالية)؛ EDC يجمع بيانات المشاركين. الأول «أين وصلنا؟» والثاني «ماذا وجدنا؟».","CTMS للراعي (Veeva، Medidata، Oracle Siebel) مقابل CTMS للموقع (Advarra OnCore، Clinical Conductor). الحبيب كموقع يحتاج الثاني مرتبطاً بنظام المستشفى.","LIMS يتتبع العينة وسلسلة الحفظ؛ ELN يوثق التجربة؛ CDS يحفظ البيانات الخام من الأجهزة.","مركز التكافؤ: قاعدة متطوعين ← تسجيل مصدري سريري ← LIMS تحليلي حيوي (مثل Watson) ← Phoenix WinNonlin ← SAS أو R.","الامتثال: Part 11، و Annex 11، و GAMP 5، و ICH E6(R3)، ونظام حماية البيانات الشخصية وضوابط NCA للسحابة. مبدأ ALCOA+.","Project Online يتوقف في 30 سبتمبر 2026؛ Project Desktop و Planner مستمران."],
     en:["CTMS manages operations (sites, milestones, recruitment, finance); EDC collects participant data. “Where are we?” vs “What did we find?”.","Sponsor CTMS (Veeva, Medidata, Oracle Siebel) vs site CTMS (Advarra OnCore, Clinical Conductor). Al Habib as a site needs the latter, linked to the hospital system.","LIMS tracks samples and chain of custody; ELN records experiments; CDS holds raw instrument data.","BE centre: volunteer database → clinical eSource → bioanalytical LIMS (e.g., Watson) → Phoenix WinNonlin → SAS or R.","Compliance: Part 11, Annex 11, GAMP 5, ICH E6(R3), Saudi PDPL and NCA cloud controls. ALCOA+.","Project Online retires 30 September 2026; Project Desktop and Planner continue."]},
  s:{ar:"أكبر مخاطر الأنظمة ليست في اختيار البرنامج، بل في كتابة المتطلبات بدقة، والتحقق من الصلاحية، والتكامل.",en:"The biggest system risk is not choosing software, but precise requirements, validation, and integration."}}
];

const CATS={you:{ar:"عنكِ",en:"About you"},eth:{ar:"الأخلاقيات",en:"Ethics"},ct:{ar:"التجارب والتنظيم",en:"Trials & regulation"},be:{ar:"التكافؤ الحيوي",en:"Bioequivalence"},ops:{ar:"التشغيل والحبيب",en:"Operations & Al Habib"}};
const QS=[
 {c:"you",q:{ar:"عرّفينا بنفسك.",en:"Tell us about yourself."},a:PITCH},
 {c:"you",q:{ar:"اشرحي لنا التسلسل الزمني لدراستك وعملك.",en:"Walk us through your education and career timeline."},
  a:{ar:"ابدئي بالتواريخ الصحيحة بعد تصحيح السيرة، بترتيب زمني واضح. إذا كانت هناك دراسة عن بُعد أو بدوام جزئي تزامنت مع عمل، قوليها صراحة قبل أن يُسأل عنها. الهدوء والوضوح هنا أهم من أي إجابة أخرى، لأن التناقض في التواريخ هو أخطر نقطة في الملف.",en:"Start with the corrected dates, in clear order. If any study was remote or part-time alongside work, say so before being asked. Calm clarity matters most here, because date inconsistencies are the biggest risk in the file."}},
 {c:"you",q:{ar:"ماذا فعلتِ بين فبراير 2021 ومايو 2023؟",en:"What did you do between February 2021 and May 2023?"},
  a:{ar:"جهزي إجابة صادقة ومحددة: ما النشاط، وما الذي تعلمتِه منه، وكيف يرتبط بمسارك. إجابة قصيرة وواثقة أفضل من الشرح الطويل.",en:"Prepare an honest, specific answer: the activity, what you learnt, and how it links to your path. Short and confident beats a long explanation."}},
 {c:"you",q:{ar:"ما طبيعة عملك مع KAIMRC تحديداً؟",en:"What exactly is your work with KAIMRC?"},
  a:{ar:"أعمل من خلال شركة استشارية في تأسيس وترخيص مركز للتكافؤ الحيوي بالتعاون مع KAIMRC و SFDA، وتشمل مسؤولياتي تخطيط البنية التحتية والامتثال، والإجراءات التشغيلية، والشراء، والتدريب. وأتحفظ على التفاصيل التعاقدية التزاماً بالسرية.",en:"Through a consulting firm, I work on establishing and licensing a bioequivalence centre with KAIMRC and the SFDA, covering infrastructure and compliance planning, operating procedures, procurement, and training. I keep contractual details confidential."}},
 {c:"you",q:{ar:"ما آخر ورقة نشرتِها، وما دورك فيها؟",en:"What is your latest publication, and what was your role?"},
  a:{ar:"اذكري اسم المجلة وسنة النشر وترتيبك بين المؤلفين ودورك الفعلي (تصميم، تجارب، تحليل، كتابة). كوني دقيقة: رئيس تحرير سيعرف إن بالغتِ.",en:"Give the journal, year, author position, and your actual role (design, experiments, analysis, writing). Be precise: an editor-in-chief will notice any overstatement."}},
 {c:"you",q:{ar:"لماذا مجموعة الحبيب؟ ولماذا الآن؟",en:"Why Al Habib, and why now?"},
  a:{ar:"المجموعة تستثمر بجدية في البحث (جوائز 1.5 مليون ريال، كلية جديدة، توسع في المستشفيات)، وهذا يحتاج بنية تشغيلية تحوّل الطموح البحثي إلى تجارب ومنشورات ممتثلة. وأنا في مرحلة انتقلت فيها من تأسيس مرفق إلى الرغبة في بناء منظومة كاملة داخل مؤسسة كبيرة.",en:"The group is investing seriously in research (SAR 1.5M awards, a new college, hospital expansion), and that needs operational infrastructure to turn ambition into compliant trials and publications. I’m at the point of moving from building one facility to building a full system inside a large institution."}},
 {c:"eth",q:{ar:"ما المبادئ الأساسية لأخلاقيات البحث؟",en:"What are the core principles of research ethics?"},
  a:{ar:"احترام الأشخاص (الاستقلالية والموافقة المستنيرة وحماية الفئات الضعيفة)، والإحسان وعدم الإضرار (تبرير الخطر بالمنفعة)، والعدالة في توزيع الأعباء والمنافع. وفي المملكة يحكمها نظام أخلاقيات البحث على المخلوقات الحية ولائحته، مع لجان محلية مسجلة لدى NCBE.",en:"Respect for persons (autonomy, informed consent, protecting the vulnerable), beneficence and non-maleficence (risk justified by benefit), and justice. In KSA they are governed by the Law of Ethics of Research on Living Creatures and its regulations, with local IRBs registered with NCBE."}},
 {c:"eth",q:{ar:"ما الفرق في الأخلاقيات بين البحث الأساسي والسريري والحيواني؟",en:"How do ethics differ across basic, clinical, and animal research?"},
  a:{ar:"الأساسي: الخطر على المعلومة، فالتركيز على السرية والموافقة على العينات. السريري: أعلى حماية، موافقة كاملة وتقييم خطر ورقابة من اللجنة والهيئة. الحيواني: لا موافقة، فالأساس هو مبدأ 3Rs: الاستبدال والتقليل والتحسين.",en:"Basic: informational risk, so confidentiality and sample consent. Clinical: highest protection, full consent, risk assessment, IRB and SFDA oversight. Animal: no consent, so the 3Rs: replacement, reduction, refinement."}},
 {c:"eth",q:{ar:"باحث ضغط عليك لتمرير بروتوكول بسرعة لأن الممول مستعجل. ماذا تفعلين؟",en:"An investigator pressures you to fast-track a protocol for an impatient sponsor. What do you do?"},
  a:{ar:"لا أتنازل عن المراجعة، لكن أبحث عن السرعة المشروعة: هل الملف مكتمل؟ هل الدراسة مؤهلة لمراجعة مختصرة؟ هل يمكن تشغيل المراجعة العلمية والأخلاقية بالتوازي؟ وأوثق التواصل. السرعة تأتي من جودة العملية، لا من تخطيها.",en:"I don’t compromise the review, but I look for legitimate speed: is the file complete, is expedited review applicable, can scientific and ethical review run in parallel? And I document everything. Speed comes from process quality, not skipping steps."}},
 {c:"eth",q:{ar:"ما الذي تغير في ICH E6(R3)؟",en:"What changed in ICH E6(R3)?"},
  a:{ar:"اعتُمد في 6 يناير 2025، ويركز على الجودة من التصميم، ورقابة متناسبة مع المخاطر، ودمج التقنيات مثل المراقبة عن بعد والأجهزة القابلة للارتداء، وتشديد نزاهة البيانات وسجلات التدقيق. وTransCelerate حدّثت معاييرها لتتوافق معه في أبريل 2025، فشهادات R2 لم تعد كافية لكثير من الرعاة.",en:"Adopted 6 January 2025: quality by design, risk-proportionate oversight, integration of remote monitoring and wearables, and stronger data integrity and audit trails. TransCelerate updated its criteria to match in April 2025, so R2 certificates no longer satisfy many sponsors."}},
 {c:"ct",q:{ar:"اشرحي مراحل التجارب السريرية باختصار.",en:"Briefly explain the clinical trial phases."},
  a:{ar:"الأولى: السلامة والجرعة والحرائك على 20–100 متطوع سليم. الثانية: فعالية أولية وتحديد الجرعة على عشرات إلى مئات المرضى. الثالثة: تأكيد الفعالية على مئات إلى آلاف، وهي أساس التسجيل. الرابعة: مراقبة ما بعد التسويق والواقع الفعلي.",en:"I: safety, dose, PK in 20–100 healthy volunteers. II: early efficacy and dose-finding in tens to hundreds of patients. III: confirm efficacy in hundreds to thousands; basis for registration. IV: post-marketing and real-world surveillance."}},
 {c:"ct",q:{ar:"ما المطلوب لتجربة مرحلة أولى في المملكة؟",en:"What does a Phase I trial need in Saudi Arabia?"},
  a:{ar:"تسجيل في SCTR، وموافقة IRB مسجلة لدى NCBE، وموافقة مسبقة من SFDA خلال 60 يوم عمل بعد اكتمال الملف، وأن تُجرى في وحدة مرحلة أولى معتمدة من الهيئة مع الالتزام بدليل مخاطر أول استخدام على الإنسان، وتدريب GCP لكل الفريق لا يتجاوز ثلاث سنوات.",en:"SCTR registration, NCBE-registered IRB approval, prior SFDA approval within 60 working days of a complete file, conduct in an SFDA-accredited Phase I unit under the first-in-human guideline, and GCP training no older than three years for the whole team."}},
 {c:"ct",q:{ar:"ما الفرق بين الراعي و CRO والباحث الرئيس؟",en:"What is the difference between the sponsor, CRO, and PI?"},
  a:{ar:"الراعي يبدأ التجربة ويمولها ويتحمل المسؤولية النهائية. CRO تنفذ مهامه بعقد. الباحث الرئيس مسؤول في الموقع عن سلامة المشاركين ودقة البيانات. والقاعدة: الراعي ينقل المهام ولا ينقل المسؤولية.",en:"The sponsor initiates, funds, and holds ultimate responsibility. The CRO performs its tasks under contract. The PI is accountable on site for participant safety and data accuracy. Rule: the sponsor delegates tasks, never responsibility."}},
 {c:"ct",q:{ar:"لماذا يجب فصل المراقب عن الفريق البحثي؟",en:"Why must the monitor be separate from the research team?"},
  a:{ar:"لأن الباحث مسؤول عن التنفيذ والمراقب مسؤول عن التحقق منه. لو اجتمعا فلا أحد يتحقق من الباحث. ودليل SFDA الإصدار 4.0 ينص صراحة على أن المراقب لا يكون من الفريق البحثي.",en:"The PI executes; the monitor verifies. If combined, no one checks the investigator. SFDA v4.0 explicitly states the monitor must not be part of the research team."}},
 {c:"ct",q:{ar:"ما الذي يميز نموذج KAIMRC في التجارب السريرية؟",en:"What distinguishes the KAIMRC clinical trials model?"},
  a:{ar:"جهاز مركزي منفصل عن الأقسام السريرية يدعم الباحثين تشغيلياً ويوفر مراقبة مستقلة، مع وحدة مرحلة أولى معتمدة، واعتمادات دولية مثل AAHRPP و GCSA. هذا يجعل المؤسسة جذابة للرعاة الدوليين.",en:"A central function separate from clinical departments, supporting investigators and providing independent monitoring, with an accredited Phase I unit and international accreditations such as AAHRPP and GCSA. That attracts international sponsors."}},
 {c:"be",q:{ar:"ما التكافؤ الحيوي ومعيار قبوله؟",en:"What is bioequivalence and its acceptance criterion?"},
  a:{ar:"إثبات أن الدواء الجنيس والمرجعي يصلان للدم بمعدل وكمية متقاربين. يُقبل إذا وقعت فترة الثقة 90% لنسبة المتوسط الهندسي لـ AUC و Cmax ضمن 80.00–125.00%. وهذا لا يعني السماح بفرق 20%.",en:"Showing a generic and reference reach the blood at a similar rate and extent. Accepted if the 90% CI of the GMR for AUC and Cmax is within 80.00–125.00%. That does not mean a 20% difference is allowed."}},
 {c:"be",q:{ar:"كيف تتعاملين مع دواء عالي التباين؟",en:"How do you handle a highly variable drug?"},
  a:{ar:"إذا تجاوز التباين داخل الشخص 30%، نستخدم تصميماً متكرراً. وفي إرشادات EMA يمكن توسيع حدود Cmax فقط حتى 69.84–143.19% حسب تباين المرجعي. مع مراجعة ما تطلبه إرشادات SFDA الحالية.",en:"If within-subject CV exceeds 30%, use a replicate design. Under EMA guidance, Cmax limits only may widen up to 69.84–143.19% based on reference variability. Always check current SFDA guidance."}},
 {c:"be",q:{ar:"اكتشفتِ أن متطوعاً مسجل في دراسة أخرى. ماذا تفعلين؟",en:"You find a volunteer is enrolled in another study. What do you do?"},
  a:{ar:"أستبعده فوراً حمايةً له ولسلامة البيانات، وأوثق الحالة وأبلغ الباحث ولجنة الأخلاقيات حسب الإجراءات. ثم أعالج السبب: سجل مركزي للمتطوعين وفحص إلزامي قبل التسجيل.",en:"Exclude them immediately to protect them and the data, document it, and inform the PI and IRB per procedure. Then fix the root cause: a central volunteer registry and mandatory pre-enrolment check."}},
 {c:"be",q:{ar:"ما أهم نظام في مركز التكافؤ الحيوي؟",en:"What is the most important system in a BE centre?"},
  a:{ar:"LIMS المتخصص للتحليل الحيوي، لأن نتيجة الدراسة تعتمد على دقة التراكيز وسلسلة حفظ العينات. وبعده قاعدة بيانات المتطوعين لحماية المشاركين من التسجيل المتكرر.",en:"The bioanalytical LIMS, because the outcome depends on accurate concentrations and sample chain of custody. Next is the volunteer database, which protects against over-volunteering."}},
 {c:"ops",q:{ar:"كيف تحسنين زمن مراجعة لجنة الأخلاقيات دون المساس بالجودة؟",en:"How would you cut IRB turnaround without hurting quality?"},
  a:{ar:"قوائم تحقق ونماذج موحدة، ومراجعة مسبقة لاكتمال الملف، وتصنيف المراجعة حسب الخطر، وتشغيل المراجعة العلمية والأخلاقية بالتوازي للدراسات منخفضة الخطورة، ونظام إلكتروني لتتبع الطلبات، وقياس زمن المراجعة كمؤشر أداء.",en:"Checklists and templates, completeness pre-screening, risk-based review tiers, parallel scientific and ethical review for low-risk studies, an electronic tracking system, and turnaround as a KPI."}},
 {c:"ops",q:{ar:"دورات GCP مجانية على الإنترنت. لماذا نطلق برنامجاً في الأكاديمية؟",en:"Free GCP courses exist online. Why should the Academy launch one?"},
  a:{ar:"التميز في ثلاثة: محتوى تنظيمي سعودي باللغتين (SFDA والنظام و NCBE)، وتطبيق عملي في موقع تجارب حقيقي، وساعات تعليم مستمر معتمدة من SCFHS، مع اعتراف دولي عبر TransCelerate. والطلب مستمر لأن SFDA تشترط تدريباً لا يتجاوز ثلاث سنوات.",en:"Three differentiators: Saudi regulatory content in both languages, hands-on practice at a real trial site, and SCFHS-accredited CPD hours, plus international recognition via TransCelerate. Demand is ongoing because the SFDA requires training no older than three years."}},
 {c:"ops",q:{ar:"ما الفرق بين CTMS و EDC؟ وما الأنظمة التي تحتاجها المجموعة كموقع تجارب؟",en:"CTMS vs EDC? And which systems does the group need as a trial site?"},
  a:{ar:"CTMS يدير العمليات، و EDC يجمع البيانات السريرية. كحد أدنى: CTMS على مستوى المؤسسة مرتبط بنظام المستشفى، ونظام إلكتروني لطلبات اللجنة، و eISF، ونظام يتتبع صلاحية شهادات GCP. أما EDC و IRT فعادة يوفرها الراعي.",en:"CTMS runs operations; EDC collects clinical data. Minimum: an institution-level CTMS linked to the hospital system, an electronic IRB system, an eISF, and a system tracking GCP validity. EDC and IRT usually come from the sponsor."}},
 {c:"ops",q:{ar:"ما خطتك لأول 90 يوماً؟",en:"What is your 90-day plan?"},
  a:{ar:"الشهر الأول: الاستماع وفهم الوضع الحالي، وقياس مؤشرات أساسية مثل زمن المراجعة وعدد الدراسات. الشهر الثاني: تحديد ثلاث فرص سريعة وخطة لها مع أصحاب القرار. الشهر الثالث: تنفيذ أولها، وتقديم تصور لبرنامج التدريب أو المكتب المركزي حسب الأولوية.",en:"Month 1: listen, map the current state, baseline KPIs such as turnaround and study volume. Month 2: agree three quick wins with decision-makers. Month 3: deliver the first, and present a plan for the training programme or central office, whichever is the priority."}},
 {c:"ops",q:{ar:"أين ترين البحث في الحبيب بعد ثلاث سنوات؟",en:"Where do you see research at Al Habib in three years?"},
  a:{ar:"موقع تجارب سريرية مرجعي في القطاع الخاص: مكتب مركزي يخدم كل المستشفيات، ولجنة أخلاقيات بزمن مراجعة تنافسي وربما اعتماد دولي، وبرنامج تدريب GCP معترف به، وشراكات مع المصانع المحلية في التكافؤ الحيوي والمرحلة الرابعة.",en:"A reference private-sector trial site: a central office serving all hospitals, a competitive IRB turnaround and perhaps international accreditation, a recognised GCP programme, and partnerships with local manufacturers in BE and Phase IV."}}
];

const LESSONS=[
{id:"eth",t:{ar:"الدرس 1: أخلاقيات البحث العلمي",en:"Lesson 1: Research ethics"},
 goal:{ar:"بعد هذا الدرس تستطيعين شرح هدف الأخلاقيات ومبادئها، والنظام السعودي، وأنواع مراجعة اللجنة، وعناصر الموافقة المستنيرة.",en:"After this lesson you can explain the purpose and principles of research ethics, the Saudi framework, IRB review types, and informed consent elements."},
 b:[
 {k:"h",ar:"ما هي أخلاقيات البحث؟",en:"What is research ethics?"},
 {k:"p",ar:"أخلاقيات البحث منظومة مبادئ وضوابط تحكم إجراء البحوث على الإنسان وعيّناته وبياناته، وعلى الحيوان. فكرتها الأساسية بسيطة: الباحث يطلب من إنسان أن يتحمل شيئاً من الخطر أو الإزعاج من أجل معرفة ستفيد غيره غالباً، وهذا يحتاج ضمانات تحمي هذا الإنسان. لذلك تكون سلامة المشارك وكرامته وحقوقه مقدَّمة دائماً على مصلحة العلم أو الممول.",en:"Research ethics is the set of principles and controls governing research on humans, their samples and data, and on animals. The core idea is simple: a researcher asks a person to accept some risk or burden for knowledge that will mostly benefit others, which requires safeguards. So participant safety, dignity, and rights always come before science or sponsor interests."},
 {k:"p",ar:"وللأخلاقيات هدف ثانٍ لا يقل أهمية: أن تكون النتائج موثوقة. بحث بُني على بيانات مزورة أو مشاركين لم يفهموا ما وافقوا عليه يضر المرضى مرتين: مرة بالمخاطرة بهم، ومرة بقرارات علاجية مبنية على نتائج خاطئة.",en:"Ethics has a second, equally important aim: credible results. Research built on fabricated data or participants who did not understand what they agreed to harms patients twice: once through the risk, and again through treatment decisions based on false results."},
 {k:"h",ar:"المبادئ الثلاثة (تقرير Belmont)",en:"The three principles (Belmont Report)"},
 {k:"tbl",h:{ar:["المبدأ","معناه","كيف يُطبَّق"],en:["Principle","Meaning","How it is applied"]},
  r:{ar:[["احترام الأشخاص","كل إنسان مستقل في قراره، ومن لا يملك القدرة الكاملة يحتاج حماية إضافية","الموافقة المستنيرة، وحق الانسحاب، وموافقة الولي للقاصرين وناقصي الأهلية"],["الإحسان وعدم الإضرار","تعظيم المنفعة وتقليل الضرر","تقييم الخطر مقابل المنفعة قبل البدء وأثناء الدراسة، ولجان مراقبة البيانات"],["العدالة","توزيع أعباء البحث ومنافعه بإنصاف","عدم استهداف فئة ضعيفة لأنها سهلة الاستقطاب، وعدم حرمان فئة من المشاركة بلا سبب"]],
     en:[["Respect for persons","Everyone is autonomous; those with reduced capacity need extra protection","Informed consent, right to withdraw, guardian consent for minors and those lacking capacity"],["Beneficence / non-maleficence","Maximise benefit, minimise harm","Risk-benefit assessment before and during the study; data monitoring committees"],["Justice","Fair distribution of research burdens and benefits","Not targeting vulnerable groups because they are easy to recruit; not excluding groups without reason"]]}},
 {k:"p",ar:"وإعلان هلسنكي الصادر عن الجمعية الطبية العالمية هو المرجع الدولي الآخر، ويؤكد أن مصلحة المشارك الفرد تتقدم على مصلحة العلم والمجتمع.",en:"The World Medical Association’s Declaration of Helsinki is the other international reference, stating that the individual participant’s interest takes precedence over science and society."},
 {k:"h",ar:"النظام السعودي",en:"The Saudi framework"},
 {k:"ul",ar:["نظام أخلاقيات البحث على المخلوقات الحية: صدر بالمرسوم الملكي م/59 بتاريخ 14/9/1431هـ (24/08/2010م)، ويعرّف المخلوق الحي بأنه الإنسان والحيوان والنبات.","يُلزم كل منشأة بحثية بتشكيل لجنة محلية من خمسة أعضاء على الأقل، من مهامها: التأكد من موافقة البحث للأنظمة، وصحة إجراءات الموافقة بعد التبصير، والموافقة الأخلاقية على البحث، والمتابعة الدورية.","يعرّف الباحث بأنه شخص مؤهل علمياً في موضوع البحث وحاصل على دورة أخلاقيات البحث. أي أن دورة الأخلاقيات شرط نظامي.","اللجنة الوطنية للأخلاقيات الحيوية (NCBE) في مدينة الملك عبدالعزيز للعلوم والتقنية: تُسجَّل لديها اللجان المحلية وتراقب أداءها.","اللائحة التنفيذية للنظام عُدّلت، ومن التعديلات أن الباحث في التجارب السريرية يقدم للجنة تقريراً كل ثلاثة أشهر، وفي البحوث الأخرى خلال مدة لا تزيد على 12 شهراً."],
  en:["Law of Ethics of Research on Living Creatures: Royal Decree M/59 dated 14/9/1431H (24 August 2010); defines living creatures as humans, animals, and plants.","Every research institution must form a local committee of at least five members, responsible for regulatory compliance, validity of informed consent, ethical approval, and periodic follow-up.","A researcher is defined as someone qualified in the research subject who has completed a research ethics course, so the ethics course is a legal requirement.","The National Committee of Bioethics (NCBE) at KACST registers local committees and monitors their performance.","The implementing regulations were amended; among the changes, clinical trial investigators report to the committee every three months, and other research within 12 months."]},
 {k:"h",ar:"أنواع مراجعة اللجنة",en:"Types of IRB review"},
 {k:"tbl",h:{ar:["النوع","متى يُستخدم","مثال"],en:["Type","When used","Example"]},
  r:{ar:[["إعفاء (Exempt)","خطر أدنى جداً ولا يمس خصوصية المشارك","استبانة مجهولة الهوية عن الرضا"],["مراجعة مختصرة (Expedited)","خطر لا يتجاوز الحد الأدنى، يراجعها عضو أو أكثر دون اجتماع كامل","مراجعة سجلات بأثر رجعي ببيانات مجهولة الهوية"],["مراجعة كاملة (Full Board)","أي خطر أعلى من الحد الأدنى","تجربة سريرية على دواء"]],
     en:[["Exempt","Very minimal risk, no privacy impact","Anonymous satisfaction survey"],["Expedited","No more than minimal risk; reviewed by one or more members without a full meeting","Retrospective review of de-identified records"],["Full board","Anything above minimal risk","A drug clinical trial"]]}},
 {k:"note",ar:"مثال من الحبيب نفسها: دراسة حديثة حصلت على موافقة لجنة الحبيب برقم RC 25.08.75، والدراسة كانت بأثر رجعي على بيانات مختبرية مجهولة الهوية، فأعفت اللجنة الباحثين من شرط الموافقة المستنيرة. هذا تطبيق عملي لفكرة تصنيف المراجعة حسب الخطر.",en:"An example from Al Habib itself: a recent study received IRB approval RC 25.08.75. It was a retrospective analysis of de-identified lab data, so the IRB waived informed consent. That is risk-based review in practice."},
 {k:"h",ar:"عناصر الموافقة المستنيرة",en:"Elements of informed consent"},
 {k:"p",ar:"الموافقة المستنيرة ليست توقيعاً على ورقة، بل عملية تبدأ بشرح واضح وتستمر طوال الدراسة. يجب أن يفهم المشارك:",en:"Informed consent is not a signature on a form; it is a process that starts with a clear explanation and continues throughout the study. The participant must understand:"},
 {k:"ul",ar:["هدف الدراسة ومدتها وما سيُطلب منه تحديداً.","المخاطر والإزعاجات المتوقعة، والمنافع المحتملة إن وُجدت.","البدائل المتاحة له خارج الدراسة.","كيف تُحفظ بياناته وسريتها.","التعويض إن وُجد، والعلاج في حال الضرر.","أن المشاركة طوعية، وأنه يستطيع الانسحاب في أي وقت دون أن يتأثر علاجه.","بمن يتواصل إذا كان لديه سؤال أو شكوى.","ودليل SFDA يطلب نموذج الموافقة بالعربي والإنجليزي."],
  en:["The study’s purpose, duration, and exactly what is asked of them.","Expected risks and discomforts, and any possible benefits.","Alternatives available outside the study.","How their data are stored and kept confidential.","Any compensation, and care in case of injury.","That participation is voluntary and they can withdraw at any time without affecting their care.","Whom to contact with questions or complaints.","The SFDA requires the consent form in Arabic and English."]},
 {k:"h",ar:"الممارسة السريرية الجيدة ICH E6(R3)",en:"Good Clinical Practice: ICH E6(R3)"},
 {k:"p",ar:"GCP معيار دولي للأخلاق والجودة العلمية في تصميم التجارب وإجرائها وتسجيلها والإبلاغ عنها. الإصدار الثالث اعتُمد في 6 يناير 2025، وهو أكبر تحديث منذ ثلاثة عقود. أبرز ما فيه: الجودة من التصميم (تحديد المخاطر من البداية)، ورقابة متناسبة مع الخطر بدلاً من مراقبة كل شيء بنفس الدرجة، ودمج التقنيات الحديثة كالمراقبة عن بعد، وتشديد نزاهة البيانات وسجلات التدقيق.",en:"GCP is the international ethical and scientific quality standard for designing, conducting, recording, and reporting trials. The third revision was adopted on 6 January 2025, the biggest update in three decades. Highlights: quality by design (identify risks upfront), risk-proportionate oversight instead of checking everything equally, integration of technologies such as remote monitoring, and stronger data integrity and audit trails."},
 {k:"warn",ar:"خطأ شائع: القول إن الأخلاقيات «تعطل البحث». الصحيح أن التأخير يُعالج بتحسين العملية (نماذج موحدة، ومراجعة مسبقة للاكتمال، وتصنيف حسب الخطر)، وليس بتخفيف المعايير.",en:"Common mistake: saying ethics “slows research down”. Delays are fixed by improving the process (templates, completeness checks, risk tiers), never by lowering standards."}

 self:[
  {q:{ar:"ما المبادئ الثلاثة لتقرير Belmont؟",en:"What are the three Belmont principles?"},a:{ar:"احترام الأشخاص، والإحسان وعدم الإضرار، والعدالة.",en:"Respect for persons, beneficence/non-maleficence, justice."}},
  {q:{ar:"ما الحد الأدنى لأعضاء اللجنة المحلية حسب النظام السعودي، ومن يسجلها؟",en:"Minimum local committee size under Saudi law, and who registers it?"},a:{ar:"خمسة أعضاء على الأقل، وتُسجَّل لدى NCBE في KACST.",en:"At least five members; registered with NCBE at KACST."}},
  {q:{ar:"دراسة استبانة مجهولة الهوية عن رضا المرضى: ما نوع المراجعة المتوقع؟",en:"An anonymous patient satisfaction survey: which review type?"},a:{ar:"إعفاء أو مراجعة مختصرة، لأن الخطر أدنى جداً.",en:"Exempt or expedited, as the risk is minimal."}}
 ]},
{id:"cmp",t:{ar:"الدرس 2: الأخلاقيات في البحث الأساسي والسريري والحيواني",en:"Lesson 2: Ethics in basic, clinical, and animal research"},
 goal:{ar:"تفرقين بين الأنواع الثلاثة: من يتحمل الخطر، وما نوعه، ومن يراقب.",en:"Distinguish the three types: who bears the risk, what kind, and who oversees."},
 b:[
 {k:"p",ar:"الأنواع الثلاثة تخضع لنفس النظام ونفس نوع اللجنة، لكن الفرق في ثلاثة أسئلة: من المعرَّض للخطر؟ وما نوع الخطر؟ وكم مستوى الرقابة المطلوب؟",en:"All three fall under the same law and committee type, but differ on three questions: who is at risk, what kind of risk, and how much oversight is needed."},
 {k:"h",ar:"1. البحث الأساسي",en:"1. Basic research"},
 {k:"p",ar:"بحث مخبري لا يتدخل في جسم الإنسان: خلايا، عينات مخزنة، بيانات، تحاليل جزيئية. الخطر الجسدي شبه معدوم، والخطر الحقيقي في المعلومة. مثال: بحث يستخدم عينات دم مخزنة لدراسة جين معين. المشارك لن يتأذى جسدياً، لكن لو تسربت نتيجته الوراثية فقد تكشف معلومات عنه وعن عائلته.",en:"Lab research with no intervention on the body: cells, stored samples, data, molecular work. Physical risk is negligible; the real risk is informational. Example: using stored blood samples to study a gene. The participant is not physically harmed, but a leaked genetic result could reveal information about them and their family."},
 {k:"ul",ar:["الموافقة على استخدام العينات والبيانات، وقد تكون موسّعة (Broad Consent) للاستخدام المستقبلي في البنوك الحيوية.","السرية وحماية البيانات، خاصة الوراثية.","تصدير العينات للخارج يحتاج إذناً من اللجنة المحلية.","الرقابة: اللجنة المحلية، غالباً مراجعة مختصرة، ولا تحتاج SFDA إلا إذا أُعطي مستحضر لإنسان."],
  en:["Consent for sample and data use, possibly broad consent for future biobank use.","Confidentiality and data protection, especially genetic data.","Exporting samples abroad needs local committee permission.","Oversight: local committee, often expedited; no SFDA unless a product is given to humans."]},
 {k:"h",ar:"2. التجارب السريرية",en:"2. Clinical trials"},
 {k:"p",ar:"تدخل مباشر على الإنسان بمستحضر أو إجراء لم تثبت سلامته أو فعاليته. هنا أعلى مستوى حماية، لأن الخطر جسدي ومباشر.",en:"Direct intervention in humans with a product or procedure not yet proven safe or effective. This carries the highest protection, since the risk is physical and direct."},
 {k:"ul",ar:["موافقة مستنيرة كاملة بلغة يفهمها المشارك، مع حق الانسحاب.","تقييم الخطر مقابل المنفعة، ولجنة مستقلة لمراقبة البيانات عند الحاجة.","حماية الفئات الضعيفة، وتأمين المشاركين، والإفصاح عن تضارب مصالح الباحث.","الإبلاغ عن الأحداث الضائرة في مدد محددة، والوصول للعلاج بعد انتهاء التجربة.","الرقابة ثلاثية: اللجنة المحلية + SFDA + التسجيل في SCTR."],
  en:["Full informed consent in an understood language, with the right to withdraw.","Risk-benefit assessment and an independent data monitoring committee where needed.","Protection of vulnerable groups, participant insurance, investigator conflict-of-interest disclosure.","Adverse event reporting within set deadlines; post-trial access to treatment.","Threefold oversight: local IRB + SFDA + SCTR registration."]},
 {k:"h",ar:"3. التجارب الحيوانية",en:"3. Animal research"},
 {k:"p",ar:"المعرَّض للخطر هو الحيوان، ولا توجد موافقة مستنيرة. فالأخلاقيات تقوم على تبرير استخدام الحيوان وتقليل معاناته، بمبدأ 3Rs:",en:"The animal bears the risk and cannot consent, so ethics rests on justifying use and minimising suffering through the 3Rs:"},
 {k:"tbl",h:{ar:["المبدأ","المعنى","مثال"],en:["Principle","Meaning","Example"]},
  r:{ar:[["الاستبدال (Replacement)","بدائل عن الحيوان متى أمكن","نماذج خلوية أو محاكاة حاسوبية"],["التقليل (Reduction)","أقل عدد يحقق دلالة إحصائية","حساب حجم العينة إحصائياً قبل البدء"],["التحسين (Refinement)","تقليل الألم والضغط","تخدير ومسكنات ونقاط إنهاء إنسانية ورعاية بيطرية"]],
     en:[["Replacement","Alternatives where possible","Cell models or computer simulation"],["Reduction","Fewest animals for statistical validity","Calculating sample size beforehand"],["Refinement","Minimise pain and distress","Anaesthesia, analgesia, humane endpoints, veterinary care"]]}},
 {k:"p",ar:"واللائحة التنفيذية تطلب في مشروع البحث الحيواني: نوع الحيوان ومصدره وعدده، وآلية تمييز كل حيوان وحفظ سجله، وخطط الطوارئ. ولا تحتاج التجربة الحيوانية موافقة SFDA، لكن إذا كانت نتائجها ستُقدَّم في ملف تجربة سريرية فيجب أن تكون وفق GLP.",en:"The regulations require animal proposals to state species, source, number, identification and records, and emergency plans. No SFDA approval is needed for the animal study, but GLP applies if results will support a clinical trial application."},
 {k:"tbl",h:{ar:["","الأساسي","السريري","الحيواني"],en:["","Basic","Clinical","Animal"]},
  r:{ar:[["المعرَّض للخطر","المعلومة والخصوصية","جسد المشارك","الحيوان"],["الموافقة","على العينة والبيانات","مستنيرة كاملة","لا تنطبق"],["المبدأ الحاكم","السرية","الخطر مقابل المنفعة و GCP","3Rs"],["الرقابة","اللجنة (مختصرة غالباً)","اللجنة + SFDA + SCTR","اللجنة أو لجنة رعاية الحيوان"],["التقرير الدوري للجنة","خلال 12 شهراً","كل 3 أشهر","دوري"]],
     en:[["Who bears risk","Information, privacy","Participant’s body","The animal"],["Consent","For samples/data","Full informed","N/A"],["Principle","Confidentiality","Risk vs benefit; GCP","3Rs"],["Oversight","IRB (often expedited)","IRB + SFDA + SCTR","IRB or animal committee"],["Report to IRB","Within 12 months","Every 3 months","Periodic"]]}}
 ],
 self:[
  {q:{ar:"لماذا يُعد الخطر في البحث الأساسي «معلوماتياً»؟",en:"Why is basic research risk “informational”?"},a:{ar:"لأنه لا تدخل في الجسد، والضرر المحتمل هو كشف بيانات المشارك، خاصة الوراثية.",en:"No bodily intervention; the possible harm is disclosure of the participant’s data, especially genetic."}},
  {q:{ar:"اذكري مبدأ 3Rs مع مثال لكل عنصر.",en:"State the 3Rs with an example each."},a:{ar:"الاستبدال (نماذج خلوية)، والتقليل (حساب حجم العينة)، والتحسين (تخدير ونقاط إنهاء إنسانية).",en:"Replacement (cell models), Reduction (sample size calculation), Refinement (anaesthesia, humane endpoints)."}},
  {q:{ar:"متى تحتاج التجربة الحيوانية أن تكون وفق GLP؟",en:"When must an animal study follow GLP?"},a:{ar:"عندما تُستخدم نتائجها في ملف تنظيمي، مثل ملف تجربة سريرية لدى SFDA.",en:"When its results support a regulatory file, such as a clinical trial application to the SFDA."}}
 ]},
{id:"ph",t:{ar:"الدرس 3: التجارب السريرية ومراحلها",en:"Lesson 3: Clinical trials and their phases"},
 goal:{ar:"تشرحين مفاهيم تصميم التجربة الأساسية، وكل مرحلة بهدفها ومشاركيها وتحدياتها التشغيلية.",en:"Explain core trial design concepts and each phase’s aim, participants, and operational challenges."},
 b:[
 {k:"h",ar:"مفاهيم أساسية قبل المراحل",en:"Core concepts first"},
 {k:"tbl",h:{ar:["المفهوم","المعنى"],en:["Concept","Meaning"]},
  r:{ar:[["البروتوكول","الوثيقة التي تصف هدف التجربة وتصميمها ومنهجها وتحليلها وتنظيمها"],["العشوائية (Randomisation)","توزيع المشاركين على المجموعات بالصدفة لمنع التحيز"],["التعمية (Blinding)","إخفاء نوع العلاج عن المشارك (مفردة) أو عنه وعن الباحث (مزدوجة)"],["المجموعة الضابطة","مجموعة تأخذ علاجاً وهمياً أو العلاج القياسي للمقارنة"],["المعيار الأولي (Primary Endpoint)","النتيجة الرئيسية التي تُقاس بها فعالية العلاج"],["معايير الاشتمال والاستبعاد","من يحق له المشاركة ومن لا يحق"],["الانحراف عن البروتوكول","أي خروج عن البروتوكول المعتمد، ويجب توثيقه والإبلاغ عنه"],["كتيب الباحث (IB)","ملخص كل المعلومات السريرية وقبل السريرية عن المستحضر"]],
     en:[["Protocol","Document describing the trial’s objectives, design, methods, analysis, and organisation"],["Randomisation","Allocating participants to groups by chance to prevent bias"],["Blinding","Hiding treatment from the participant (single) or participant and investigator (double)"],["Control group","Receives placebo or standard treatment for comparison"],["Primary endpoint","The main outcome used to judge efficacy"],["Inclusion / exclusion","Who may and may not take part"],["Protocol deviation","Any departure from the approved protocol; must be documented and reported"],["Investigator’s Brochure (IB)","Summary of all clinical and non-clinical data on the product"]]}},
 {k:"h",ar:"المرحلة الصفرية (Phase 0)",en:"Phase 0"},
 {k:"p",ar:"جرعات دقيقة جداً على عدد قليل لاستكشاف سلوك الدواء في الجسم قبل المرحلة الأولى. ليست إلزامية.",en:"Micro-doses in a few people to explore drug behaviour before Phase I. Not mandatory."},
 {k:"h",ar:"المرحلة الأولى (Phase I)",en:"Phase I"},
 {k:"ul",ar:["الهدف: السلامة والتحمل وتحديد الجرعة الآمنة، ودراسة الحرائك الدوائية: كيف يمتص الجسم الدواء ويوزعه ويستقلبه ويطرحه.","المشاركون: عادة 20–100 متطوع سليم. في أدوية الأورام يكونون مرضى لأن الدواء سام بطبيعته.","التصاميم: الجرعة المفردة المتصاعدة (SAD)، والمتعددة المتصاعدة (MAD)، وتأثير الطعام.","التشغيل: وحدة مبيت ومراقبة 24 ساعة، وجاهزية طوارئ، وسحب عينات بتوقيت دقيق، وسلسلة حفظ العينات، وسجل متطوعين.","في المملكة: يجب أن تُجرى في وحدة مرحلة أولى معتمدة من SFDA."],
  en:["Aim: safety, tolerability, safe dose, and pharmacokinetics (absorption, distribution, metabolism, excretion).","Participants: usually 20–100 healthy volunteers; in oncology, patients.","Designs: single ascending dose (SAD), multiple ascending dose (MAD), food effect.","Operations: overnight unit with 24-hour monitoring, emergency readiness, time-critical sampling, chain of custody, volunteer registry.","In KSA: must be conducted in an SFDA-accredited Phase I unit."]},
 {k:"h",ar:"المرحلة الثانية (Phase II)",en:"Phase II"},
 {k:"ul",ar:["الهدف: مؤشرات أولية على الفعالية، وتحديد الجرعة المثلى (Dose-ranging)، واستمرار تقييم السلامة.","المشاركون: عشرات إلى بضع مئات من المرضى.","غالباً عشوائية ومقارنة، وقد تُقسم إلى IIa لإثبات المفهوم و IIb لتحديد الجرعة.","التشغيل: استقطاب مرضى بمعايير دقيقة، وتنسيق بين الأقسام، وإدارة الدواء التجريبي من الاستلام إلى المحاسبة عليه."],
  en:["Aim: early efficacy signals, optimal dose (dose-ranging), continued safety.","Participants: tens to a few hundred patients.","Often randomised and controlled; may split into IIa (proof of concept) and IIb (dose-finding).","Operations: precise patient recruitment, cross-department coordination, investigational product management from receipt to accountability."]},
 {k:"h",ar:"المرحلة الثالثة (Phase III)",en:"Phase III"},
 {k:"ul",ar:["الهدف: تأكيد الفعالية على نطاق واسع ومقارنة الدواء بالعلاج القياسي، ورصد الآثار الأقل شيوعاً. هي الأساس لطلب التسجيل (Pivotal).","المشاركون: مئات إلى آلاف، غالباً في مراكز ودول متعددة.","التشغيل: إدارة مواقع متعددة، وعقود وميزانيات، ومراقبة مبنية على المخاطر، وجودة بيانات عالية، وجاهزية دائمة للتفتيش."],
  en:["Aim: confirm efficacy at scale versus standard treatment and detect less common effects; the pivotal basis for registration.","Participants: hundreds to thousands, often multi-site and multi-country.","Operations: multi-site management, contracts and budgets, risk-based monitoring, high data quality, constant inspection readiness."]},
 {k:"h",ar:"المرحلة الرابعة (Phase IV)",en:"Phase IV"},
 {k:"ul",ar:["الهدف: مراقبة الدواء بعد تسويقه، ورصد الآثار النادرة وطويلة المدى، ودراسة الاستخدام الفعلي في فئات لم تُدرس.","التشغيل: اليقظة الدوائية، والسجلات المرضية، والدراسات على البيانات الروتينية.","فرصة كبيرة لمستشفيات بحجم الحبيب لكثرة المرضى والبيانات."],
  en:["Aim: post-marketing surveillance of rare and long-term effects and real-world use in unstudied groups.","Operations: pharmacovigilance, registries, studies on routine data.","A major opportunity for a hospital group of Al Habib’s size, given patient and data volume."]},
 {k:"note",ar:"ربط مهم: دراسات التكافؤ الحيوي تصميمها قريب من المرحلة الأولى، لأنها على متطوعين أصحاء وتقيس الحرائك. لذلك خبرتك في تأسيس مركز تكافؤ قريبة جداً من متطلبات وحدات المرحلة الأولى.",en:"Key link: BE studies resemble Phase I (healthy volunteers, PK measurement), so your BE centre experience is very close to Phase I unit requirements."}
 ],
 self:[
  {q:{ar:"ما الفرق بين التعمية المفردة والمزدوجة؟",en:"Single vs double blinding?"},a:{ar:"المفردة: المشارك لا يعرف علاجه. المزدوجة: المشارك والباحث لا يعرفان.",en:"Single: the participant doesn’t know. Double: neither participant nor investigator knows."}},
  {q:{ar:"لماذا تكون المرحلة الأولى في أدوية الأورام على مرضى؟",en:"Why is oncology Phase I done in patients?"},a:{ar:"لأن الدواء سام بطبيعته، فلا يجوز تعريض أصحاء له.",en:"The drug is inherently toxic, so exposing healthy people is unjustified."}},
  {q:{ar:"أي مرحلة هي الأساس لتسجيل الدواء؟",en:"Which phase is the basis for registration?"},a:{ar:"المرحلة الثالثة (Pivotal).",en:"Phase III (pivotal)."}}
 ]},
{id:"reg",t:{ar:"الدرس 4: الموافقات التنظيمية في المملكة",en:"Lesson 4: Regulatory approvals in Saudi Arabia"},
 goal:{ar:"تعرفين ما تطلبه SFDA لكل نوع دراسة، والالتزامات أثناء الدراسة وبعدها، حسب الإصدار 4.0 (28 يونيو 2026).",en:"Know SFDA requirements for each study type and obligations during and after, per v4.0 (28 June 2026)."},
 b:[
 {k:"h",ar:"المتطلبات المشتركة",en:"Common requirements"},
 {k:"ul",ar:["التسجيل في السجل السعودي للتجارب السريرية (SCTR) لكل الدراسات، والتسجيل لا يعني الموافقة.","موافقة لجنة أخلاقيات محلية مسجلة لدى NCBE.","تدريب GCP لكل الفريق البحثي، وآخر تدريب لا يتجاوز ثلاث سنوات.","وجود رسمي أو ممثل قانوني في المملكة لمقدم الطلب.","رخصة استيراد للمستحضرات، ولا يُفرج عن المستحضر التجريبي قبل الموافقة الكاملة.","رسوم 15,000 ريال، تُعفى منها الدراسات الحكومية وغير الممولة والمرحلة الرابعة."],
  en:["SCTR registration for all studies; registration is not approval.","Approval from an NCBE-registered local IRB.","GCP training for the whole team, no older than three years.","Official presence or legal representative in KSA.","Import licence; investigational product not released before full approval.","SAR 15,000 fee, waived for government, unsponsored, and Phase IV studies."]},
 {k:"h",ar:"من يقدم الطلب؟",en:"Who applies?"},
 {k:"ul",ar:["تجربة ترعاها جهة حكومية: مركز الأبحاث أو المستشفى أو CRO أو الباحث الرئيس المفوض.","تجربة يرعاها القطاع الخاص: الراعي أو CRO.","تجربة غير ممولة: الباحث الرئيس أو CRO."],
  en:["Government-sponsored: the research centre, hospital, CRO, or authorised PI.","Private-sector sponsored: the sponsor or CRO.","Unsponsored: the PI or CRO."]},
 {k:"h",ar:"حسب نوع الدراسة",en:"By study type"},
 {k:"tbl",h:{ar:["النوع","موقف الهيئة","اشتراط خاص","مدة الرد"],en:["Type","SFDA position","Specific","Response"]},
  r:{ar:[["المرحلة الأولى","موافقة مسبقة","وحدة معتمدة + دليل مخاطر أول استخدام على الإنسان + تقارير قبل سريرية","60 يوم عمل"],["الثانية","موافقة مسبقة","بروتوكول، كتيب باحث، ملف المستحضر، تأمين، خطة مراقبة","40 يوم عمل"],["الثالثة","موافقة مسبقة","كالثانية + IDMC عند الحاجة","30 يوم عمل"],["الرابعة","إخطار وإقرار","التسجيل في SCTR وإرسال المتطلبات خلال 20 يوم عمل من موافقة IRB","10 أيام عمل"],["التكافؤ الحيوي","موافقة مسبقة","مركز مرخّص من الهيئة أو جهة محلية أو مجلس الصحة الخليجي","15 يوم عمل"],["المنتجات الحيوية","موافقة مسبقة","لقاحات، علاج جيني، خلايا جذعية، بدائل حيوية، في أي مرحلة","60 يوم عمل"]],
     en:[["Phase I","Prior approval","Accredited unit + first-in-human risk guideline + preclinical reports","60 WD"],["Phase II","Prior approval","Protocol, IB, IP dossier, insurance, monitoring plan","40 WD"],["Phase III","Prior approval","As II + IDMC where needed","30 WD"],["Phase IV","Notification + acknowledgement","SCTR registration and submission within 20 WD of IRB approval","10 WD"],["BE","Prior approval","Centre licensed by SFDA, local authority, or Gulf Health Council","15 WD"],["Biologicals","Prior approval","Vaccines, gene therapy, stem cells, biosimilars, any phase","60 WD"]]}},
 {k:"note",ar:"المدد تبدأ بعد اكتمال المستندات واجتياز التحقق الإداري، وتتوقف أثناء رد مقدم الطلب على الملاحظات. وتوصي الهيئة بألا تتجاوز جولات المراجعة ثلاث جولات.",en:"Timelines start after complete documents and administrative validation, and stop while the applicant responds. The SFDA recommends fewer than three review rounds."},
 {k:"h",ar:"حالات المرحلة الرابعة",en:"Phase IV nuances"},
 {k:"ul",ar:["إذا تضمنت الدراسة على دواء مسجل استطباباً جديداً، أو تغيير الجرعة أو طريقة الإعطاء، أو شكلاً صيدلانياً جديداً، فهي تُعامل كمرحلة مبكرة وتحتاج موافقة كاملة.","الدراسات غير التداخلية لجمع معلومات السلامة أو السجلات القائمة على الملاحظة تتبع دليل ممارسات اليقظة الدوائية الجيدة (GVP).","الاستبانات والاستطلاعات (رضا، وعي) مستثناة من التسجيل في SCTR."],
  en:["A study on a registered drug with a new indication, dose or route change, or new dosage form is treated as early-phase and needs full approval.","Non-interventional safety studies and observational registries follow Good Pharmacovigilance Practices (GVP).","Surveys (satisfaction, awareness) are exempt from SCTR registration."]},
 {k:"h",ar:"أثناء الدراسة وبعدها",en:"During and after the study"},
 {k:"ul",ar:["تقرير تقدم سنوي مع سجل التفويض وإثبات تدريب GCP. وإذا كانت مدة الدراسة أقل من سنة، يُقدم بعد مرور نصف المدة.","التعديلات الجوهرية (بروتوكول، كتيب الباحث، نموذج الموافقة) تحتاج موافقة قبل التطبيق، وغير الجوهرية تُذكر في التقرير السنوي.","إذا تعرض مشارك لخطر، يجوز تطبيق التعديل فوراً مع إبلاغ الهيئة واللجنة.","SUSAR: خلال 15 يوماً كحد أقصى، أو 7 أيام إذا كان مميتاً أو مهدداً للحياة مع تقرير متابعة خلال 8 أيام، وتقرير DSUR سنوي.","إخطار الهيئة خلال 60 يوماً عند الإكمال أو الإنهاء أو التعليق، والتقرير النهائي خلال سنة وفق ICH E3.","تصدير العينات الحيوية يحتاج إذن تصدير من اللجنة المحلية.","المراقب لا يجوز أن يكون من الفريق البحثي، وتُقدم خطة المراقبة مع سيرته وشهادة GCP.","يجب الإفصاح عن استخدام الذكاء الاصطناعي في وثائق التجربة عند التقديم."],
  en:["Annual progress report with delegation log and GCP proof; if under a year, at half the study duration.","Substantial amendments (protocol, IB, consent form) need approval first; non-substantial go in the annual report.","If a participant is at risk, an amendment may be applied immediately with notification to the SFDA and IRB.","SUSAR: within 15 days at most, or 7 days if fatal or life-threatening with follow-up within 8 days; annual DSUR.","Notify within 60 days of completion, termination, or suspension; final report within one year per ICH E3.","Exporting biological samples requires the local IRB’s export permission.","The monitor must not be on the research team; submit the monitoring plan with their CV and GCP.","Any use of AI in trial documents must be declared on submission."]},
 {k:"h",ar:"جديد في الإصدار 4.0",en:"New in v4.0"},
 {k:"ul",ar:["مسار الاعتماد (Reliance): تسريع المراجعة إذا كانت الدراسة معتمدة من جهة صارمة: FDA أو EMA أو MHRA أو Swissmedic.","برنامج الوصول بعد التجربة (PTAP): استمرار العلاج للمشاركين المستفيدين، ويُقدم خلال 60 يوماً قبل الإغلاق.","قسم للدراسات التي يبادر بها الباحثون، والسماح بالتقديم المتوازي."],
  en:["Reliance pathway: faster review with approval from a stringent authority: FDA, EMA, MHRA, or Swissmedic.","Post-Trial Access Programme (PTAP): continued treatment for benefiting participants; submit 60 days before close-out.","A section for investigator-initiated studies, and parallel submission."]},
 {k:"note",ar:"نقطة قوية: الإصدار 4.0 صدر قبل أقل من ثلاثة أشهر. معرفتك بتفاصيله تعكس متابعتك للتحديثات.",en:"Strong point: v4.0 was issued less than three months ago. Knowing its details shows you keep up to date."}
 ],
 self:[
  {q:{ar:"كم مدة رد الهيئة لكل من المرحلة الأولى والتكافؤ الحيوي والرابعة؟",en:"SFDA response time for Phase I, BE, and Phase IV?"},a:{ar:"60 و 15 و 10 أيام عمل.",en:"60, 15, and 10 working days."}},
  {q:{ar:"دراسة مرحلة رابعة على دواء مسجل لكن بجرعة جديدة: ماذا تحتاج؟",en:"Phase IV on a registered drug at a new dose: what is needed?"},a:{ar:"موافقة كاملة، لأنها تُعامل كمرحلة مبكرة.",en:"Full approval; it is treated as early-phase."}},
  {q:{ar:"ما مهلة إبلاغ SUSAR المميت؟",en:"Deadline for a fatal SUSAR?"},a:{ar:"7 أيام، ثم تقرير متابعة خلال 8 أيام.",en:"7 days, then follow-up within 8 days."}}
 ]},
{id:"be",t:{ar:"الدرس 5: التكافؤ الحيوي",en:"Lesson 5: Bioequivalence"},
 goal:{ar:"تشرحين التكافؤ الحيوي ومؤشراته ومعيار قبوله بمثال رقمي، وتصميم الدراسة ومكوناتها التشغيلية وأخلاقياتها.",en:"Explain BE, its parameters and acceptance with a numeric example, the design, operational pillars, and ethics."},
 b:[
 {k:"h",ar:"الفكرة",en:"The idea"},
 {k:"p",ar:"عندما تنتهي حماية براءة دواء أصلي، تستطيع المصانع إنتاج نسخة جنيسة بنفس المادة الفعالة والجرعة. لكن كيف نتأكد أن النسخة تعمل مثل الأصلي دون تكرار كل التجارب السريرية؟ الجواب: نثبت أن الدواءين يوصلان المادة الفعالة إلى الدم بنفس المعدل ونفس الكمية تقريباً. إذا تطابق مستوى الدواء في الدم، فالمتوقع أن يتطابق الأثر العلاجي.",en:"When an originator’s patent expires, manufacturers can make a generic with the same active ingredient and strength. How do we know it works the same without repeating all trials? We show both deliver the active ingredient to the blood at essentially the same rate and extent. If blood levels match, the therapeutic effect is expected to match."},
 {k:"p",ar:"وهذا ما يجعل التكافؤ الحيوي أساس التوطين الدوائي: كل مصنع محلي ينتج دواءً جنيساً يحتاج دراسة تكافؤ لتسجيله.",en:"That is why BE underpins pharmaceutical localisation: every local generic manufacturer needs BE studies to register products."},
 {k:"h",ar:"المؤشرات الحرائكية",en:"PK parameters"},
 {k:"tbl",h:{ar:["المؤشر","المعنى","ماذا يعكس"],en:["Parameter","Meaning","Reflects"]},
  r:{ar:[["Cmax","أعلى تركيز يصل له الدواء في الدم","معدل (سرعة) الامتصاص"],["AUC","المساحة تحت منحنى التركيز مع الزمن","كمية الامتصاص الكلية"],["Tmax","الزمن اللازم للوصول لأعلى تركيز","مؤشر داعم"]],
     en:[["Cmax","Peak blood concentration","Rate of absorption"],["AUC","Area under the concentration-time curve","Total extent of absorption"],["Tmax","Time to peak","Supportive"]]}},
 {k:"h",ar:"معيار القبول بمثال",en:"Acceptance criterion, with an example"},
 {k:"p",ar:"نحسب نسبة المتوسط الهندسي (GMR) للجنيس إلى المرجعي، ثم فترة الثقة 90% حولها. يُقبل التكافؤ إذا وقعت الفترة كاملة بين 80.00% و 125.00% لكل من AUC و Cmax. نستخدم المتوسط الهندسي لأن بيانات التركيز تُحلل بعد تحويلها لوغاريتمياً، ولذلك الحدود غير متماثلة (80 و 125 هما مقلوب بعضهما).",en:"We compute the geometric mean ratio (GMR) of generic to reference and its 90% confidence interval. BE is accepted if the whole interval lies between 80.00% and 125.00% for both AUC and Cmax. Geometric means are used because concentrations are log-transformed, which is why the limits are asymmetric (80 and 125 are reciprocals)."},
 {k:"tbl",h:{ar:["مثال توضيحي","GMR","فترة الثقة 90%","النتيجة"],en:["Illustrative example","GMR","90% CI","Result"]},
  r:{ar:[["دواء أ","98%","91% – 106%","مقبول: الفترة كاملة داخل الحدود"],["دواء ب","86%","78% – 95%","مرفوض: الحد الأدنى تحت 80%"],["دواء ج","100%","79% – 127%","مرفوض رغم أن المتوسط مثالي: تباين عالٍ أو عينة صغيرة"]],
     en:[["Drug A","98%","91%–106%","Pass: the whole interval is inside"],["Drug B","86%","78%–95%","Fail: lower bound below 80%"],["Drug C","100%","79%–127%","Fail despite a perfect mean: high variability or small sample"]]}},
 {k:"warn",ar:"خطأ شائع: القول إن 80–125% تسمح بفرق 20%. المثال (ج) يوضح أن متوسطاً مثالياً قد يفشل. عملياً يجب أن يكون المتوسطان قريبين جداً والتباين منخفضاً حتى تقع الفترة كاملة داخل الحدود.",en:"Common mistake: saying 80–125% allows a 20% difference. Example C shows a perfect mean can still fail. In practice, means must be very close and variability low for the whole interval to fit."},
 {k:"h",ar:"حالات خاصة",en:"Special cases"},
 {k:"ul",ar:["الأدوية عالية التباين: إذا كان التباين داخل الشخص 30% أو أكثر. في إرشادات EMA يمكن توسيع حدود Cmax فقط (لا AUC) حتى 69.84–143.19% حسب تباين المرجعي، بتصميم متكرر (Replicate).","الأدوية ضيقة المؤشر العلاجي (مثل بعض أدوية الصرع ومضادات التخثر): حدود أضيق لأن الفرق البسيط قد يكون خطراً.","الإعفاء الحيوي (Biowaiver): إعفاء بعض الأدوية من الدراسة البشرية بناءً على نظام التصنيف الصيدلاني الحيوي (BCS) واختبارات الذوبان.","لـ SFDA دليل خاص بالتكافؤ الحيوي؛ راجعي نسخته الحالية لأن الأرقام أعلاه من FDA و EMA."],
  en:["Highly variable drugs: within-subject CV of 30% or more. Under EMA guidance, Cmax limits only (not AUC) may widen up to 69.84–143.19% based on reference variability, using a replicate design.","Narrow therapeutic index drugs (some antiepileptics, anticoagulants): tighter limits, as small differences can be dangerous.","Biowaiver: some drugs exempt from human study based on BCS and dissolution testing.","The SFDA has its own BE guideline; review its current version, as the figures above are from FDA and EMA."]},
 {k:"h",ar:"تصميم الدراسة",en:"Study design"},
 {k:"p",ar:"التصميم المعتاد: دراسة عشوائية متقاطعة بفترتين وتسلسلين (2x2). نصف المتطوعين يأخذون الجنيس أولاً ثم المرجعي، والنصف الآخر العكس. بين الفترتين فترة غسيل كافية لخروج الدواء، عادة لا تقل عن خمسة أضعاف عمر النصف. ميزة التقاطع أن كل متطوع يُقارن بنفسه، فيقل تأثير الفروق بين الأشخاص. وتُجرى صائمين أو بعد وجبة حسب الدواء.",en:"Standard design: randomised two-period, two-sequence (2x2) crossover. Half the volunteers take the generic first then the reference, the other half the reverse, with a washout of usually at least five half-lives between. Crossover lets each volunteer serve as their own control, reducing between-person variability. Fasting or fed depending on the drug."},
 {k:"h",ar:"المكونات التشغيلية الثلاثة",en:"Three operational pillars"},
 {k:"tbl",h:{ar:["المكون","ما يحدث","متطلبات أساسية"],en:["Pillar","What happens","Key requirements"]},
  r:{ar:[["الشق السريري","فحص واستقطاب، إيواء، جرعات، سحب عينات بدقة زمنية، مراقبة السلامة","GCP، وحدة مبيت، طوارئ، سجل متطوعين"],["الشق التحليلي","تحليل تراكيز الدواء في البلازما، غالباً بجهاز LC-MS/MS","GLP، طرق تحليل مصادق عليها، تجميد العينات، سلسلة الحفظ، إعادة تحليل عينات مختارة"],["الشق الإحصائي والحرائكي","حساب Cmax و AUC و Tmax وفترات الثقة وإعداد التقرير","برامج مصادق عليها مثل Phoenix WinNonlin و SAS أو R"]],
     en:[["Clinical","Screening, housing, dosing, time-critical sampling, safety monitoring","GCP, overnight unit, emergency readiness, volunteer registry"],["Bioanalytical","Measuring plasma concentrations, usually by LC-MS/MS","GLP, validated methods, frozen storage, chain of custody, incurred sample reanalysis"],["PK and statistics","Calculating Cmax, AUC, Tmax and confidence intervals; reporting","Validated software such as Phoenix WinNonlin and SAS or R"]]}},
 {k:"h",ar:"أخلاقيات التكافؤ الحيوي",en:"BE ethics"},
 {k:"ul",ar:["المتطوع السليم لا ينتفع علاجياً، فيجب أن يكون الخطر في أدنى مستوى.","التعويض المالي عادل لكن لا يصبح إغراءً يدفع للمشاركة رغم المخاطر.","سجل مركزي للمتطوعين يمنع المشاركة في أكثر من دراسة خلال فترة قصيرة.","موافقة بلغة مفهومة وحق الانسحاب في أي وقت.","الشفافية مع اللجنة في أي حدث ضائر."],
  en:["Healthy volunteers gain no therapeutic benefit, so risk must be minimal.","Fair compensation that does not become an inducement to accept risk.","A central registry to prevent enrolment in multiple studies in a short period.","Plain-language consent and the right to withdraw at any time.","Transparency with the IRB about any adverse event."]}
 ],
 self:[
  {q:{ar:"دواء GMR فيه 100% وفترة الثقة 79–127%. هل هو مكافئ؟ ولماذا؟",en:"GMR 100%, CI 79–127%. Bioequivalent? Why?"},a:{ar:"لا. الفترة تخرج عن 80–125% رغم المتوسط المثالي، بسبب تباين عالٍ أو عينة صغيرة.",en:"No. The interval falls outside 80–125% despite a perfect mean, due to high variability or small sample."}},
  {q:{ar:"لماذا يُستخدم التصميم المتقاطع؟",en:"Why use a crossover design?"},a:{ar:"لأن كل متطوع يُقارن بنفسه، فيقل أثر الفروق بين الأشخاص ويكفي عدد أقل.",en:"Each volunteer is their own control, reducing between-person variability and sample size."}},
  {q:{ar:"ما المؤشر الذي يعكس معدل الامتصاص؟",en:"Which parameter reflects absorption rate?"},a:{ar:"Cmax.",en:"Cmax."}}
 ]},
{id:"par",t:{ar:"الدرس 6: أطراف منظومة التجارب السريرية",en:"Lesson 6: The clinical trial ecosystem"},
 goal:{ar:"تشرحين دور الشركة والراعي و CRO والباحث، والتسلسل من الفكرة للتسجيل، ومسار السلامة، والوثائق الأساسية.",en:"Explain the roles of company, sponsor, CRO, and PI, the sequence to registration, the safety flow, and essential documents."},
 b:[
 {k:"p",ar:"أسهل طريقة للفهم هي تشبيه التجربة بمشروع إنشائي: الشركة الدوائية صاحبة المنتج، والراعي المالك القانوني للمشروع، و CRO مدير المشروع المتعاقد، والباحث الرئيس المسؤول في الموقع. وحولهم جهتان رقابيتان: لجنة الأخلاقيات التي تحمي المشاركين، و SFDA التي تجيز وتراقب.",en:"Think of a trial as a construction project: the pharmaceutical company owns the product, the sponsor is the project’s legal owner, the CRO is the contracted project manager, and the PI is accountable on site. Two oversight bodies surround them: the IRB protecting participants, and the SFDA authorising and supervising."},
 {k:"tbl",h:{ar:["الطرف","التعريف","أبرز المسؤوليات","يُحاسب على"],en:["Party","Definition","Key duties","Accountable for"]},
  r:{ar:[["الشركة الدوائية","طوّرت المستحضر أو تصنّعه، وغالباً صاحبة حق التسويق","دراسات قبل سريرية وفق GLP، تصنيع وفق GMP، ملف التسجيل، اليقظة الدوائية","جودة المنتج وسلامته بعد التسويق"],["الراعي","فرد أو جهة تتولى بدء التجربة وإدارتها وتمويلها","البروتوكول وكتيب الباحث، اختيار المواقع، الموافقات، المستحضر، المراقبة، السلامة، التأمين، التقرير النهائي","المسؤولية النهائية عن الجودة ونزاهة البيانات"],["CRO","جهة يتعاقد معها الراعي لأداء بعض مهامه أو كلها","الجدوى، الملف التنظيمي، المراقبة، إدارة البيانات، اليقظة الدوائية","جودة المهام المفوضة بموجب العقد"],["الباحث الرئيس","المؤهل المسؤول عن التجربة في موقع محدد","موافقة اللجنة، الاستقطاب والموافقة المستنيرة، تطبيق البروتوكول، الرعاية الطبية، إدارة المستحضر، سجل التفويض","سلامة المشاركين ودقة بيانات موقعه"]],
     en:[["Pharma company","Developed or manufactures the product; usually the MAH","GLP preclinical studies, GMP manufacture, registration dossier, pharmacovigilance","Product quality and post-marketing safety"],["Sponsor","Individual or entity that initiates, manages, and funds the trial","Protocol and IB, site selection, approvals, IP, monitoring, safety, insurance, final report","Ultimate responsibility for quality and data integrity"],["CRO","Contracted by the sponsor for some or all duties","Feasibility, regulatory dossier, monitoring, data management, pharmacovigilance","Quality of delegated tasks under contract"],["PI","Qualified person accountable for the trial at a site","IRB approval, recruitment and consent, protocol adherence, medical care, IP management, delegation log","Participant safety and site data accuracy"]]}},
 {k:"note",ar:"القاعدة الذهبية: الراعي يستطيع نقل المهام إلى CRO، لكنه لا يستطيع نقل المسؤولية النهائية. وإذا بادر الباحث بالتجربة دون ممول، يصبح «الباحث الراعي» ويتحمل الدورين.",en:"Golden rule: the sponsor can transfer tasks to a CRO but never ultimate responsibility. An investigator who initiates an unfunded trial becomes a sponsor-investigator and carries both roles."},
 {k:"h",ar:"في السعودية تحديداً",en:"Saudi specifics"},
 {k:"ul",ar:["الراعي بلا وجود رسمي في المملكة يستطيع تفويض CRO أو الباحث الرئيس، بشرط أن يشمل التفويض كل المسؤوليات والإجراءات النظامية.","الباحث يوقع «إقرار الباحث» (Form 4) الذي يتضمن رقم تسجيله في الهيئة السعودية للتخصصات الصحية ورقم تسجيل اللجنة لدى NCBE.","الباحث يفصح عن مصالحه المالية مع الراعي (Form 3)."],
  en:["A sponsor without KSA presence can authorise a CRO or the PI, covering all responsibilities and legal procedures.","The PI signs the Statement of Investigator (Form 4) with their SCFHS number and the IRB’s NCBE number.","The PI discloses financial interests with the sponsor (Form 3)."]},
 {k:"h",ar:"التسلسل من الفكرة إلى الدواء المسجل",en:"From idea to registered drug"},
 {k:"ol",ar:["التطوير قبل السريري (الشركة): دراسات سمية وحرائك، وتصنيع دفعات تجريبية.","التخطيط (الراعي): البروتوكول وكتيب الباحث واختيار CRO.","الجدوى واختيار المواقع (CRO).","التعاقد: اتفاقية التجربة (CTA) والميزانية مع الموقع.","الموافقات: اللجنة (الباحث) و SCTR و SFDA ورخصة الاستيراد (الراعي أو CRO).","تفعيل الموقع: تدريب الفريق وتوريد المستحضر وزيارة البدء.","التنفيذ (الباحث وفريقه): الاستقطاب والموافقة والجرعات والبيانات.","المراقبة والسلامة: زيارات المراقبة ومعالجة الاستفسارات والإبلاغ.","الإغلاق: قفل قاعدة البيانات وإتلاف أو إعادة المستحضر.","التحليل والتقرير النهائي وفق ICH E3.","التسجيل (الشركة)، ثم اليقظة الدوائية والمرحلة الرابعة."],
  en:["Preclinical (company): toxicology and PK, trial batches.","Planning (sponsor): protocol, IB, CRO selection.","Feasibility and site selection (CRO).","Contracting: CTA and budget with the site.","Approvals: IRB (PI), SCTR, SFDA, import licence (sponsor/CRO).","Site activation: training, IP supply, initiation visit.","Conduct (PI and team): recruitment, consent, dosing, data.","Monitoring and safety: visits, queries, reporting.","Close-out: database lock, IP destruction or return.","Analysis and final report per ICH E3.","Registration (company), then pharmacovigilance and Phase IV."]},
 {k:"h",ar:"مسار معلومات السلامة",en:"Safety information flow"},
 {k:"ol",ar:["الباحث يرصد الحدث الضائر الخطير ويعالجه، ويبلغ الراعي فوراً ويُخطر اللجنة.","الراعي أو CRO يقيّم: هل هو مرتبط بالدواء؟ وهل هو متوقع حسب كتيب الباحث؟","إذا كان SUSAR: يُبلغ الهيئة خلال 15 يوماً، أو 7 إذا كان مميتاً أو مهدداً للحياة.","الراعي يحدّث كتيب الباحث و DSUR ويبلغ كل الباحثين."],
  en:["The PI detects and treats the serious adverse event, reports to the sponsor immediately, and notifies the IRB.","The sponsor or CRO assesses: related to the drug? expected per the IB?","If a SUSAR: report to the SFDA within 15 days, or 7 if fatal or life-threatening.","The sponsor updates the IB and DSUR and informs all investigators."]},
 {k:"h",ar:"الوثائق الأساسية التي يجب معرفتها",en:"Essential documents to know"},
 {k:"tbl",h:{ar:["الوثيقة","الغرض"],en:["Document","Purpose"]},
  r:{ar:[["نموذج الموافقة المستنيرة (ICF)","توثيق موافقة المشارك بعد الشرح"],["نموذج الحالة (CRF)","تسجيل بيانات كل مشارك حسب البروتوكول"],["سجل التفويض (Delegation Log)","من في الفريق مفوض بأي مهمة"],["سجل محاسبة المستحضر","كل وحدة مستلمة ومصروفة ومعادة أو متلفة"],["ملف التجربة الرئيسي (TMF)","كل الوثائق الأساسية للتجربة لدى الراعي، وجاهزيته للتفتيش"],["ملف الموقع (ISF)","الوثائق الأساسية لدى الموقع"]],

{id:"kai",t:{ar:"الدرس 7: نموذج KAIMRC والفرق بين CRO و SMO",en:"Lesson 7: The KAIMRC model, CRO vs SMO"},
 goal:{ar:"تشرحين كيف تنظم مؤسسة كبرى التجارب السريرية، ولماذا يُفصل الباحث عن المراقبة.",en:"Explain how a major institution organises trials, and why the investigator is separated from monitoring."},
 b:[
 {k:"warn",ar:"تحدثي عن KAIMRC كمعلومات عامة منشورة فقط، دون أي تفاصيل تعاقدية أو تشغيلية داخلية من عملك.",en:"Discuss KAIMRC only as published public information, without contractual or internal operational details from your work."},
 {k:"h",ar:"الهيكل",en:"Structure"},
 {k:"p",ar:"لدى KAIMRC إدارة للتجارب السريرية بفريق متعدد التخصصات من منسقين وباحثين حاصلين على GCP، تدير التجربة من الجدوى إلى الإغلاق. ومن وحداتها: وحدة الأدوية التجريبية، ووحدة المراقبة وضمان الجودة، ووحدة المرحلة الأولى التي تقدمها KAIMRC على أنها الوحيدة المعتمدة من SFDA في المملكة، ومكتب لتعزيز التجارب والتواصل مع الرعاة.",en:"KAIMRC has a Clinical Trial Management department with GCP-certified coordinators and investigators, running trials from feasibility to close-out. Units include an Investigational Drug Unit, Monitoring and QA, a Phase 1 unit that KAIMRC presents as the only SFDA-accredited one in the Kingdom, and an engagement office for sponsors."},
 {k:"h",ar:"CRO أم SMO؟",en:"CRO or SMO?"},
 {k:"tbl",h:{ar:["","CRO","SMO / مكتب أبحاث الموقع"],en:["","CRO","SMO / site research office"]},
  r:{ar:[["يعمل لصالح","الراعي","الموقع والباحث"],["أمثلة المهام","المراقبة، إدارة البيانات، الملف التنظيمي","المنسقون، الاستقطاب، صيدلية الدواء التجريبي، تفعيل الموقع"]],
     en:[["Works for","The sponsor","The site and investigator"],["Typical tasks","Monitoring, data management, regulatory dossier","Coordinators, recruitment, investigational pharmacy, site activation"]]}},
 {k:"h",ar:"ثلاث حالات",en:"Three scenarios"},

     en:[["Industry-sponsored","The company, usually with an external CRO","Site support (SMO role)","External CRO"],["Investigator-initiated","KAIMRC itself","CRO-like: design, monitoring, data, reporting","Monitoring unit, independent of the team"],["Bioequivalence","Usually the generic manufacturer","The BE centre runs clinical and bioanalytical phases","Sponsor or its CRO"]]}},
 {k:"h",ar:"لماذا الفصل؟",en:"Why separate?"},
 {k:"p",ar:"الباحث مسؤول عن التنفيذ، والمراقب مسؤول عن التحقق منه. لو اجتمع الدوران فلا أحد يتحقق من الباحث. ولهذا ينص دليل SFDA الإصدار 4.0 على أن المراقب لا يجوز أن يكون من الفريق البحثي.",en:"The PI executes; the monitor verifies. If combined, no one checks the investigator. That is why SFDA v4.0 states the monitor must not be on the research team."},
 {k:"h",ar:"إنجازات منشورة",en:"Published achievements"},
 {k:"ul",ar:["اعتماد AAHRPP لبرنامج حماية المشاركين (2023).","شهادة GCSA من IAOCR في يونيو 2025، كأول شبكة مواقع تجارب في المملكة.","مذكرة تفاهم مع Flagship Pioneering (نوفمبر 2025) لتجارب المراحل المبكرة لأدوية مبتكرة."],
  en:["AAHRPP accreditation of its human research protection programme (2023).","IAOCR GCSA certification in June 2025, the first trial site network in KSA.","MOU with Flagship Pioneering (November 2025) for early-phase trials of novel medicines."]},
 {k:"note",ar:"الرسالة للحبيب: «الباحثون في الأقسام من جهة، ومكتب مركزي يدعم الموقع ويشغّل المراقبة المستقلة من جهة أخرى. هذا ما يجذب الرعاة الدوليين.»",en:"Message for Al Habib: “Investigators in departments, and a central office supporting the site and running independent monitoring. That is what attracts international sponsors.”"}
 ],
